        // 設定今日日期（加拿大多倫多時間）
        function setTodayDate() {
            try {
                const now = new Date();
                
                // 使用最可靠的方法：toLocaleDateString with en-CA locale
                // en-CA 格式直接返回 YYYY-MM-DD，最適合用於 date input
                const torontoDateString = now.toLocaleDateString('en-CA', {
                    timeZone: 'America/Toronto'
                });
                
                // 驗證格式並設置
                if (torontoDateString && torontoDateString.match(/^\d{4}-\d{2}-\d{2}$/)) {
                    document.getElementById('dateInput').value = torontoDateString;
                    console.log('多倫多日期:', torontoDateString);
                    return;
                }
                
                // 備用方法：使用 formatToParts（更精確）
                const formatter = new Intl.DateTimeFormat('en-CA', {
                    timeZone: 'America/Toronto',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                
                const parts = formatter.formatToParts(now);
                if (parts && parts.length > 0) {
                    const year = parts.find(p => p.type === 'year')?.value;
                    const month = parts.find(p => p.type === 'month')?.value;
                    const day = parts.find(p => p.type === 'day')?.value;
                    
                    if (year && month && day) {
                        document.getElementById('dateInput').value = `${year}-${month}-${day}`;
                        console.log('多倫多日期 (formatToParts):', `${year}-${month}-${day}`);
                        return;
                    }
                }
                
                // 最後備用：手動計算（不推薦，但作為最後手段）
                console.warn('使用備用方法計算多倫多日期');
                const utcTime = now.getTime();
                const localOffset = now.getTimezoneOffset() * 60000; // 本地時區偏移（毫秒）
                const utcTime2 = utcTime + localOffset;
                
                // 多倫多時區：12月是標準時間 UTC-5
                // 但我們需要動態判斷是否為夏令時
                // 簡化：12月肯定是標準時間 UTC-5
                const torontoOffset = -5 * 3600000; // UTC-5 = -5小時
                const torontoTime = new Date(utcTime2 + torontoOffset);
                
                const year = torontoTime.getUTCFullYear();
                const month = String(torontoTime.getUTCMonth() + 1).padStart(2, '0');
                const day = String(torontoTime.getUTCDate()).padStart(2, '0');
                
                document.getElementById('dateInput').value = `${year}-${month}-${day}`;
                console.log('多倫多日期 (手動計算):', `${year}-${month}-${day}`);
            } catch (error) {
                console.error('獲取多倫多時間失敗:', error);
                // 最後的備用方案：使用當前日期
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                document.getElementById('dateInput').value = `${year}-${month}-${day}`;
            }
        }


        // Supabase API（使用登入後的 access_token，才能通過 RLS）
        async function getAccessToken() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session?.access_token) {
                throw new Error('尚未登入');
            }
            return session.access_token;
        }

        async function supabaseRequest(table, method = 'GET', data = null, filters = '') {
            if (!USE_SUPABASE) return null;
            
            try {
                const token = await getAccessToken();
                const url = `${SUPABASE_URL}/rest/v1/${table}${filters}`;
                const options = {
                    method: method,
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    }
                };
                
                if (data && (method === 'POST' || method === 'PATCH')) {
                    options.body = JSON.stringify(data);
                }
                
                console.log(`[Supabase] ${method} ${table}`, data || filters);
                
                const response = await fetch(url, options);
                
                if (!response.ok) {
                    let errorText = '';
                    try {
                        errorText = await response.text();
                    } catch (e) {
                        errorText = response.statusText;
                    }
                    console.error(`[Supabase] Error ${response.status}:`, errorText);
                    throw new Error(`Supabase error ${response.status}: ${response.statusText} - ${errorText}`);
                }
                
                if (method === 'DELETE') {
                    return true;
                }
                
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    const result = await response.json();
                    return result;
                } else {
                    const text = await response.text();
                    return text ? JSON.parse(text) : [];
                }
            } catch (error) {
                console.error('[Supabase] Request failed:', error);
                return null;
            }
        }

        function isDisplayableImageUrl(url) {
            if (!url || typeof url !== 'string') return false;
            return url.startsWith('http://') || url.startsWith('https://')
                || url.startsWith('data:') || url.startsWith('blob:');
        }

        function extractStorageObjectPath(pathOrUrl) {
            if (!pathOrUrl || typeof pathOrUrl !== 'string') return '';
            if (!pathOrUrl.startsWith('http://') && !pathOrUrl.startsWith('https://')) {
                return pathOrUrl.replace(/^\/+/, '');
            }
            try {
                const u = new URL(pathOrUrl);
                const markers = [
                    '/storage/v1/object/public/diary-images/',
                    '/storage/v1/object/sign/diary-images/',
                    '/storage/v1/object/authenticated/diary-images/',
                    '/storage/v1/object/diary-images/'
                ];
                for (const marker of markers) {
                    const idx = u.pathname.indexOf(marker);
                    if (idx >= 0) {
                        return decodeURIComponent(u.pathname.slice(idx + marker.length));
                    }
                }
            } catch (_) { /* ignore */ }
            return '';
        }

        async function resolveImageUrl(pathOrUrl) {
            if (!pathOrUrl) return '';
            if (pathOrUrl.startsWith('data:') || pathOrUrl.startsWith('blob:')) return pathOrUrl;

            const objectPath = extractStorageObjectPath(pathOrUrl) || (
                (pathOrUrl.startsWith('http://') || pathOrUrl.startsWith('https://')) ? '' : pathOrUrl
            );

            // 已是簽名／外連網址且不像本專案 private 物件 → 直接用
            if (!objectPath && isDisplayableImageUrl(pathOrUrl)) return pathOrUrl;

            const cacheKey = objectPath || pathOrUrl;
            const cached = signedUrlCache[cacheKey];
            if (cached && cached.expiresAt > Date.now()) return cached.url;

            if (!objectPath) {
                console.warn('[Storage] cannot resolve image path:', pathOrUrl);
                return isDisplayableImageUrl(pathOrUrl) ? pathOrUrl : '';
            }

            const { data, error } = await sb.storage
                .from('diary-images')
                .createSignedUrl(objectPath, SIGNED_URL_TTL);
            if (error || !data?.signedUrl) {
                console.warn('[Storage] signed URL failed:', objectPath, error);
                // 備援：直接 download 成 blob URL（同樣需 SELECT 權限）
                try {
                    const { data: blob, error: dlErr } = await sb.storage
                        .from('diary-images')
                        .download(objectPath);
                    if (dlErr || !blob) {
                        console.warn('[Storage] download failed:', objectPath, dlErr);
                        return '';
                    }
                    const blobUrl = URL.createObjectURL(blob);
                    signedUrlCache[cacheKey] = {
                        url: blobUrl,
                        expiresAt: Date.now() + 30 * 60 * 1000
                    };
                    return blobUrl;
                } catch (e) {
                    console.warn('[Storage] download exception:', objectPath, e);
                    return '';
                }
            }
            signedUrlCache[cacheKey] = {
                url: data.signedUrl,
                expiresAt: Date.now() + (SIGNED_URL_TTL - 60) * 1000
            };
            return data.signedUrl;
        }

        async function attachSignedImageUrls(items) {
            return Promise.all(items.map(async (diary) => {
                const paths = Array.isArray(diary.images) ? diary.images : [];
                const imageUrls = await Promise.all(paths.map(resolveImageUrl));
                return { ...diary, imageUrls };
            }));
        }

        async function ensureDiariesHaveSignedUrls(items) {
            if (!Array.isArray(items) || items.length === 0) return items || [];
            const needFix = items.some((diary) => {
                const paths = Array.isArray(diary.images) ? diary.images : [];
                if (!paths.length) return false;
                const urls = Array.isArray(diary.imageUrls) ? diary.imageUrls : [];
                if (urls.length !== paths.length) return true;
                return urls.some((u) => !isDisplayableImageUrl(u));
            });
            if (!needFix) return items;
            return attachSignedImageUrls(items);
        }

        function getDiaryDisplayImageUrls(diary) {
            const urls = Array.isArray(diary.imageUrls) ? diary.imageUrls : [];
            return urls.filter(isDisplayableImageUrl);
        }

        // 圖片壓縮函數（壓縮到100KB以下）
        function compressImage(file, maxSizeKB = 100) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDimension = 1200; // 最大尺寸
                        
                        // 如果圖片太大，先縮放
                        if (width > maxDimension || height > maxDimension) {
                            if (width > height) {
                                height = (height / width) * maxDimension;
                                width = maxDimension;
                            } else {
                                width = (width / height) * maxDimension;
                                height = maxDimension;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 嘗試不同的質量直到文件大小小於100KB
                        let quality = 0.9;
                        let dataUrl = canvas.toDataURL('image/jpeg', quality);
                        
                        const tryCompress = () => {
                            const sizeKB = (dataUrl.length * 3 / 4) / 1024; // base64大小轉換
                            
                            if (sizeKB <= maxSizeKB || quality <= 0.1) {
                                // 轉換為Blob
                                const byteString = atob(dataUrl.split(',')[1]);
                                const mimeString = dataUrl.split(',')[0].split(':')[1].split(';')[0];
                                const ab = new ArrayBuffer(byteString.length);
                                const ia = new Uint8Array(ab);
                                for (let i = 0; i < byteString.length; i++) {
                                    ia[i] = byteString.charCodeAt(i);
                                }
                                const blob = new Blob([ab], { type: mimeString });
                                resolve(blob);
                            } else {
                                quality -= 0.1;
                                dataUrl = canvas.toDataURL('image/jpeg', quality);
                                tryCompress();
                            }
                        };
                        
                        tryCompress();
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // 上傳圖片到 Supabase Storage（private；回傳 object path）
        async function uploadImageToSupabase(blob, fileName) {
            if (!USE_SUPABASE) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                });
            }
            
            try {
                const userId = getUserId();
                if (!userId) throw new Error('尚未登入，無法上傳');
                const timestamp = Date.now();
                // 壓縮後固定為 jpeg，副檔名也統一，避免路徑／型別不一致
                const baseName = String(fileName || 'image').replace(/\.[^.]+$/, '');
                const cleanFileName = baseName.replace(/[^a-zA-Z0-9.-]/g, '_') || 'image';
                const uniqueFileName = `${userId}/${timestamp}_${cleanFileName}.jpg`;
                
                console.log('[Supabase Storage] Uploading:', uniqueFileName);
                
                const { error } = await sb.storage
                    .from('diary-images')
                    .upload(uniqueFileName, blob, {
                        contentType: 'image/jpeg',
                        upsert: true,
                        cacheControl: '3600'
                    });
                
                if (error) {
                    console.error('[Supabase Storage] Upload failed:', error);
                    throw new Error(error.message || '圖片上傳失敗');
                }

                // 快取簽名網址供預覽
                const previewUrl = await resolveImageUrl(uniqueFileName);
                if (!previewUrl) {
                    console.warn('[Supabase Storage] Upload ok but signed URL failed:', uniqueFileName);
                    showToast('圖片已上傳，但預覽失敗（請檢查 Storage 讀取權限）', 'error');
                }
                console.log('[Supabase Storage] Uploaded path:', uniqueFileName);
                return uniqueFileName;
            } catch (error) {
                console.error('[Supabase Storage] Upload error:', error);
                showToast('圖片上傳失敗，請重試', 'error');
                return null;
            }
        }

        // 初始化圖片上傳功能
        function initImageUpload() {
            console.log('[Image Upload] Initializing image upload...');
            const imageUploadArea = document.getElementById('imageUploadArea');
            const imageFileInput = document.getElementById('imageFileInput');
            const container = document.querySelector('.container');
            
            if (!imageUploadArea) {
                console.error('[Image Upload] imageUploadArea not found!');
                return;
            }
            if (!imageFileInput) {
                console.error('[Image Upload] imageFileInput not found!');
                return;
            }
            if (!container) {
                console.error('[Image Upload] container not found!');
                return;
            }
            
            console.log('[Image Upload] Elements found, setting up event listeners...');
            
            // 文件選擇
            imageFileInput.addEventListener('change', async (e) => {
                console.log('[Image Upload] File input changed, files:', e.target.files.length);
                if (e.target.files.length > 0) {
                    console.log('[Image Upload] Processing files...');
                    await handleFiles(Array.from(e.target.files));
                    // 清空input，允許重複選擇同一文件
                    e.target.value = '';
                } else {
                    console.log('[Image Upload] No files selected');
                }
            });
            
            console.log('[Image Upload] File input event listener added');
            
            // 在整個容器上添加拖拽功能（支持從其他窗口拖拽）
            const handleDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.dataTransfer.types.includes('Files')) {
                    imageUploadArea.classList.add('dragover');
                }
            };
            
            const handleDragLeave = (e) => {
                e.preventDefault();
                e.stopPropagation();
                // 只有當離開容器時才移除樣式
                if (!e.currentTarget.contains(e.relatedTarget)) {
                    imageUploadArea.classList.remove('dragover');
                }
            };
            
            const handleDrop = async (e) => {
                e.preventDefault();
                e.stopPropagation();
                imageUploadArea.classList.remove('dragover');
                
                const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('image/'));
                if (files.length > 0) {
                    await handleFiles(files);
                }
            };
            
            // 在上傳區域添加拖拽事件
            imageUploadArea.addEventListener('dragover', handleDragOver);
            imageUploadArea.addEventListener('dragleave', handleDragLeave);
            imageUploadArea.addEventListener('drop', handleDrop);
            
            // 在整個容器上添加拖拽事件（支持從其他窗口拖拽）
            container.addEventListener('dragover', handleDragOver);
            container.addEventListener('dragleave', handleDragLeave);
            container.addEventListener('drop', handleDrop);
        }

        // 處理上傳的圖片（target: 'top' | 'inline'）
        async function handleFiles(files, target = null) {
            const useInline = target === 'inline'
                || (target == null && currentEditingId !== null && !!document.getElementById('inlineDiaryInput'));
            const imageList = useInline ? inlineEditImages : uploadedImages;
            const uploadProgress = document.getElementById(useInline ? 'inlineUploadProgress' : 'uploadProgress');
            
            if (uploadProgress) {
                uploadProgress.style.display = 'block';
                uploadProgress.textContent = '正在壓縮和上傳圖片...';
            }
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (uploadProgress) uploadProgress.textContent = `正在處理圖片 ${i + 1}/${files.length}...`;
                
                try {
                    const compressedBlob = await compressImage(file);
                    console.log(`[Image] Compressed ${file.name}: ${(file.size / 1024).toFixed(2)}KB -> ${(compressedBlob.size / 1024).toFixed(2)}KB`);
                    
                    const imagePath = await uploadImageToSupabase(compressedBlob, file.name);
                    if (!imagePath) continue;
                    imageList.push(imagePath);
                    if (useInline) await updateInlineImagePreview();
                    else await updateImagePreview();
                } catch (error) {
                    console.error('[Image] Error processing image:', error);
                    showToast(`處理圖片 ${file.name} 失敗`, 'error');
                }
            }
            
            if (uploadProgress) {
                uploadProgress.style.display = 'none';
                uploadProgress.textContent = '';
            }
            if (!useInline) saveDiaryDraft();
        }

        // 移除圖片（上方新日記）
        async function removeImage(index) {
            uploadedImages.splice(index, 1);
            await updateImagePreview();
            saveDiaryDraft();
        }

        async function removeInlineImage(index) {
            inlineEditImages.splice(index, 1);
            await updateInlineImagePreview();
        }

        // 更新圖片預覽（paths → signed URL）
        async function updateImagePreview() {
            const uploadedImagesContainer = document.getElementById('uploadedImages');
            if (!uploadedImagesContainer) {
                console.error('[Image Preview] Container not found');
                return;
            }

            uploadedImagesContainer.innerHTML = '';
            if (uploadedImages.length === 0) return;

            for (let index = 0; index < uploadedImages.length; index++) {
                const pathOrUrl = uploadedImages[index];
                const displayUrl = await resolveImageUrl(pathOrUrl);
                if (!displayUrl) {
                    console.warn('[Image Preview] missing URL for', pathOrUrl);
                }
                const imageItem = document.createElement('div');
                imageItem.className = 'uploaded-image-item';
                imageItem.innerHTML = `
                    <img src="${displayUrl || ''}" alt="上傳的圖片" onerror="console.error('Failed to load image', ${JSON.stringify(pathOrUrl)})">
                    <button class="remove-image" onclick="removeImage(${index})">×</button>
                `;
                uploadedImagesContainer.appendChild(imageItem);
            }
        }

        async function updateInlineImagePreview() {
            const container = document.getElementById('inlineUploadedImages');
            if (!container) return;
            container.innerHTML = '';
            if (!inlineEditImages.length) return;

            for (let index = 0; index < inlineEditImages.length; index++) {
                const pathOrUrl = inlineEditImages[index];
                const displayUrl = await resolveImageUrl(pathOrUrl);
                const imageItem = document.createElement('div');
                imageItem.className = 'uploaded-image-item';
                imageItem.innerHTML = `
                    <img src="${displayUrl || ''}" alt="上傳的圖片">
                    <button class="remove-image" onclick="removeInlineImage(${index})">×</button>
                `;
                container.appendChild(imageItem);
            }
        }

        // 目前登入使用者的 auth.uid()
        function getUserId() {
            return currentUserId;
        }

        function mapSupabaseDiaries(diariesData) {
            return diariesData.map(d => ({
                id: d.id,
                date: d.date,
                content: d.content,
                translation: d.translation || '',
                tags: d.tags || [],
                images: d.images || [],
                createdAt: d.created_at,
                isPinned: typeof d.is_pinned === 'boolean' ? d.is_pinned : isDiaryPinned(d.id)
            }));
        }

        function normalizeDiaryId(id) {
            return String(id);
        }

        function sameDiaryId(a, b) {
            return normalizeDiaryId(a) === normalizeDiaryId(b);
        }

        function findDiaryIndexById(id) {
            return diaries.findIndex(d => sameDiaryId(d.id, id));
        }

        function loadPinnedDiaryIds() {
            try {
                const saved = localStorage.getItem(PINNED_DIARY_IDS_KEY);
                pinnedDiaryIds = saved ? JSON.parse(saved) : {};
                if (!pinnedDiaryIds || typeof pinnedDiaryIds !== 'object' || Array.isArray(pinnedDiaryIds)) {
                    pinnedDiaryIds = {};
                }
            } catch (error) {
                console.warn('載入置頂資料失敗，已重置:', error);
                pinnedDiaryIds = {};
            }
        }

        function persistPinnedDiaryIds() {
            localStorage.setItem(PINNED_DIARY_IDS_KEY, JSON.stringify(pinnedDiaryIds));
        }

        function isDiaryPinned(id) {
            return !!pinnedDiaryIds[normalizeDiaryId(id)];
        }

        function sortDiariesWithPinnedFirst(items) {
            return [...items].sort((a, b) => {
                const pinDiff = (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0);
                if (pinDiff !== 0) return pinDiff;
                const dateDiff = (b.date || '').localeCompare(a.date || '');
                if (dateDiff !== 0) return dateDiff;
                return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
            });
        }

        async function togglePinDiary(id, event) {
            if (event) event.stopPropagation();
            const diaryIndex = findDiaryIndexById(id);
            if (diaryIndex < 0) {
                console.warn('[Pin] diary not found:', id);
                showToast('找不到這篇日記，請重新整理後再試', 'error');
                return;
            }
            const key = normalizeDiaryId(diaries[diaryIndex].id);
            const nextPinned = !diaries[diaryIndex].isPinned;

            diaries[diaryIndex].isPinned = nextPinned;
            renderDiaryList();

            if (USE_SUPABASE) {
                const updateResult = await supabaseRequest('diaries', 'PATCH', {
                    is_pinned: nextPinned
                }, `?id=eq.${encodeURIComponent(diaries[diaryIndex].id)}`);

                // PostgREST 在 RLS 擋下時可能回 200 + []
                if (!updateResult || (Array.isArray(updateResult) && updateResult.length === 0)) {
                    diaries[diaryIndex].isPinned = !nextPinned;
                    renderDiaryList();
                    showToast('置頂同步失敗，請稍後再試', 'error');
                    return;
                }
            }

            if (nextPinned) {
                pinnedDiaryIds[key] = true;
            } else {
                delete pinnedDiaryIds[key];
            }
            persistPinnedDiaryIds();
            allDiariesSearchCache = null;
            searchCacheUserId = null;
            const searchInput = document.getElementById('searchInput');
            if (searchInput && searchInput.value.trim()) {
                searchInput.dispatchEvent(new Event('input', { bubbles: true }));
            }
            showToast(nextPinned ? '已置頂這篇日記' : '已取消置頂', 'success');
        }

        function saveDiaryDraft() {
            // 就地編輯不寫入上方草稿，避免跟「新日記」混淆
            if (currentEditingId !== null) return;

            const dateInput = document.getElementById('dateInput');
            const diaryInput = document.getElementById('diaryInput');
            const translationInput = document.getElementById('translationInput');
            if (!dateInput || !diaryInput || !translationInput) return;

            const draft = {
                date: dateInput.value,
                content: diaryInput.value || '',
                translation: translationInput.value || '',
                images: Array.isArray(uploadedImages) ? uploadedImages : [],
                updatedAt: new Date().toISOString()
            };

            const hasMeaningfulDraft = draft.content.trim() || draft.translation.trim() || (draft.images && draft.images.length > 0);
            if (!hasMeaningfulDraft) {
                localStorage.removeItem(DIARY_DRAFT_KEY);
                return;
            }

            localStorage.setItem(DIARY_DRAFT_KEY, JSON.stringify(draft));
        }

        function clearDiaryDraft() {
            localStorage.removeItem(DIARY_DRAFT_KEY);
        }

        function restoreDiaryDraftIfNeeded() {
            const diaryInput = document.getElementById('diaryInput');
            const dateInput = document.getElementById('dateInput');
            const translationInput = document.getElementById('translationInput');
            if (!diaryInput || !dateInput || !translationInput) return;
            if (diaryInput.value.trim()) return;
            if (currentEditingId !== null) return;

            let draft = null;
            try {
                draft = JSON.parse(localStorage.getItem(DIARY_DRAFT_KEY) || 'null');
            } catch (error) {
                draft = null;
            }
            if (!draft || typeof draft !== 'object') return;

            const hasMeaningfulDraft = (draft.content && draft.content.trim()) || (draft.translation && draft.translation.trim()) || (Array.isArray(draft.images) && draft.images.length > 0);
            if (!hasMeaningfulDraft) return;

            if (draft.date) {
                dateInput.value = draft.date;
            }
            diaryInput.value = draft.content || '';
            translationInput.value = draft.translation || '';
            uploadedImages = Array.isArray(draft.images) ? draft.images : [];
            updateImagePreview();
            autoResizeDiaryInput();

            if (translationInput.value.trim()) {
                document.getElementById('translationSection').classList.add('show');
                document.getElementById('translationSection').style.display = 'block';
            }

            showToast('已恢復未完成草稿', 'info');
        }

        function setDiaryListLoadingState(text = '', isError = false) {
            const diaryList = document.getElementById('diaryList');
            if (!diaryList) return;
            let loadingEl = document.getElementById('diaryLoadingHint');
            if (!loadingEl) {
                loadingEl = document.createElement('div');
                loadingEl.id = 'diaryLoadingHint';
                loadingEl.className = 'list-status';
                diaryList.parentNode.insertBefore(loadingEl, diaryList.nextSibling);
            }
            loadingEl.textContent = text;
            loadingEl.classList.toggle('is-error', !!isError);
            loadingEl.style.display = text ? 'block' : 'none';
        }

        async function loadMoreDiaries() {
            // 就地編輯中若重繪列表，會丟失未存內容並把畫面捲回編輯項頂部
            if (currentEditingId !== null) return;
            if (!USE_SUPABASE || !activeSupabaseUserId || !hasMoreDiaries || isLoadingMoreDiaries) return;
            isLoadingMoreDiaries = true;
            setDiaryListLoadingState('載入更多日記中...');
            try {
                const filters = `?user_id=eq.${activeSupabaseUserId}&order=is_pinned.desc,created_at.desc&limit=${DIARIES_PAGE_SIZE}&offset=${diariesOffset}`;
                const pageData = await supabaseRequest('diaries', 'GET', null, filters);
                const mapped = (pageData && Array.isArray(pageData)) ? mapSupabaseDiaries(pageData) : [];
                const mappedWithUrls = await attachSignedImageUrls(mapped);
                diaries = diaries.concat(mappedWithUrls);
                diariesOffset += mappedWithUrls.length;
                hasMoreDiaries = mappedWithUrls.length === DIARIES_PAGE_SIZE;
                renderDiaryList();
                setDiaryListLoadingState(hasMoreDiaries ? '往下滾動可載入更多' : '已載入全部日記');
            } catch (error) {
                console.error('[Supabase] 載入更多日記失敗:', error);
                setDiaryListLoadingState('載入失敗，請稍後再試', true);
            } finally {
                isLoadingMoreDiaries = false;
            }
        }

        async function ensureAllDiariesForSearch() {
            if (!USE_SUPABASE || !activeSupabaseUserId) return diaries;
            if (allDiariesSearchCache && searchCacheUserId === activeSupabaseUserId) return allDiariesSearchCache;
            if (searchCachePromise) return await searchCachePromise;

            searchCachePromise = (async () => {
                isLoadingSearchCache = true;
                setDiaryListLoadingState('搜尋中，正在載入完整日記資料...');
                try {
                    let offset = 0;
                    let allRows = [];
                    while (true) {
                        const filters = `?user_id=eq.${activeSupabaseUserId}&order=is_pinned.desc,created_at.desc&limit=${SEARCH_FETCH_PAGE_SIZE}&offset=${offset}`;
                        const pageData = await supabaseRequest('diaries', 'GET', null, filters);
                        const mapped = (pageData && Array.isArray(pageData)) ? mapSupabaseDiaries(pageData) : [];
                        const mappedWithUrls = await attachSignedImageUrls(mapped);
                        allRows = allRows.concat(mappedWithUrls);
                        if (mapped.length < SEARCH_FETCH_PAGE_SIZE) break;
                        offset += mapped.length;
                    }
                    allDiariesSearchCache = allRows;
                    searchCacheUserId = activeSupabaseUserId;
                    return allDiariesSearchCache;
                } catch (error) {
                    console.error('[Supabase] 載入搜尋快取失敗:', error);
                    return diaries;
                } finally {
                    isLoadingSearchCache = false;
                    searchCachePromise = null;
                }
            })();

            return await searchCachePromise;
        }

        // 載入日記（首屏僅載入第一頁）
        async function loadDiaries() {
            if (USE_SUPABASE) {
                try {
                    diaries = [];
                    allDiariesSearchCache = null;
                    searchCacheUserId = null;
                    searchCachePromise = null;
                    diariesOffset = 0;
                    hasMoreDiaries = true;

                    const userId = getUserId();
                    if (!userId) throw new Error('尚未登入');
                    activeSupabaseUserId = userId;
                    console.log('[Supabase] Loading first diary page for user:', userId);
                    
                    const diariesData = await supabaseRequest('diaries', 'GET', null, `?user_id=eq.${userId}&order=is_pinned.desc,created_at.desc&limit=${DIARIES_PAGE_SIZE}&offset=0`);
                    console.log('[Supabase] Loaded first page diaries:', diariesData);

                    diaries = (diariesData && Array.isArray(diariesData)) ? mapSupabaseDiaries(diariesData) : [];
                    diaries = await attachSignedImageUrls(diaries);
                    diariesOffset = diaries.length;
                    hasMoreDiaries = diaries.length === DIARIES_PAGE_SIZE;

                    const tagsData = await supabaseRequest('tag_usage', 'GET', null, `?user_id=eq.${userId}`);
                    if (tagsData && Array.isArray(tagsData)) {
                        tagUsage = {};
                        tagsData.forEach(t => {
                            tagUsage[t.tag_name] = t.usage_count;
                        });
                    } else {
                        tagUsage = {};
                    }
                } catch (error) {
                    console.error('[Supabase] 載入日記失敗:', error);
                    diaries = [];
                    tagUsage = {};
                    hasMoreDiaries = false;
                }
            } else {
                const saved = localStorage.getItem('diaries');
                if (saved) {
                    diaries = JSON.parse(saved);
                }
                const savedTagUsage = localStorage.getItem('tagUsage');
                if (savedTagUsage) {
                    tagUsage = JSON.parse(savedTagUsage);
                }
                hasMoreDiaries = false;
            }
            
            diaries = diaries.map(diary => ({
                ...diary,
                isPinned: isDiaryPinned(diary.id) || !!diary.isPinned
            }));
            renderDiaryList();
            setDiaryListLoadingState(USE_SUPABASE ? (hasMoreDiaries ? '往下滾動可載入更多' : '已載入全部日記') : '');
        }

        // 儲存日記（上方＝新增；就地編輯＝更新）
        async function saveDiary() {
            const isInline = currentEditingId !== null && !!document.getElementById('inlineDiaryInput');
            const date = isInline
                ? document.getElementById('inlineDateInput')?.value
                : document.getElementById('dateInput').value;
            const content = (isInline
                ? document.getElementById('inlineDiaryInput')?.value
                : document.getElementById('diaryInput').value || '').trim();
            const translation = (isInline
                ? document.getElementById('inlineTranslationInput')?.value
                : document.getElementById('translationInput').value || '').trim();
            const imagePaths = isInline ? inlineEditImages : uploadedImages;
            
            if (!content) {
                alert('請輸入日記內容！');
                return;
            }

            if (!date) {
                alert('請選擇日期！');
                return;
            }

            // 提取標籤
            const tags = extractTags(content);
            
            // 更新標籤使用次數
            tags.forEach(tag => {
                tagUsage[tag] = (tagUsage[tag] || 0) + 1;
            });

            const userId = getUserId();

            // 就地編輯：更新現有日記
            if (isInline) {
                const existingIndex = findDiaryIndexById(currentEditingId);
                if (existingIndex < 0) {
                    showToast('找不到這篇日記', 'error');
                    return;
                }
                const existingDiary = diaries[existingIndex];
                const updatedDiary = {
                    ...existingDiary,
                    date: date,
                    content: content,
                    translation: translation,
                    tags: tags,
                    images: Array.isArray(imagePaths) ? [...imagePaths] : [],
                    isPinned: existingDiary.isPinned || false,
                    updatedAt: new Date().toISOString()
                };
                const [withUrls] = await attachSignedImageUrls([updatedDiary]);
                diaries[existingIndex] = withUrls;
                
                if (USE_SUPABASE) {
                    console.log('[Supabase] Updating diary:', currentEditingId);
                    const updateResult = await supabaseRequest('diaries', 'PATCH', {
                        date: date,
                        content: content,
                        translation: translation || null,
                        tags: tags.length > 0 ? tags : null,
                        images: updatedDiary.images,
                        is_pinned: !!existingDiary.isPinned
                    }, `?id=eq.${currentEditingId}`);
                    console.log('[Supabase] Update result:', updateResult);
                    if (!updateResult) {
                        console.error('[Supabase] Failed to update diary');
                    }
                }

                currentEditingId = null;
                inlineEditImages = [];
                localStorage.setItem('diaries', JSON.stringify(diaries));
                localStorage.setItem('tagUsage', JSON.stringify(tagUsage));
                allDiariesSearchCache = null;
                searchCacheUserId = null;
                searchCachePromise = null;

                // 更新標籤到 Supabase
                if (USE_SUPABASE && Object.keys(tagUsage).length > 0) {
                    for (const [tagName, count] of Object.entries(tagUsage)) {
                        try {
                            const existing = await supabaseRequest('tag_usage', 'GET', null, `?user_id=eq.${userId}&tag_name=eq.${tagName}`);
                            if (existing && Array.isArray(existing) && existing.length > 0) {
                                await supabaseRequest('tag_usage', 'PATCH', { usage_count: count }, `?user_id=eq.${userId}&tag_name=eq.${tagName}`);
                            } else {
                                await supabaseRequest('tag_usage', 'POST', { user_id: userId, tag_name: tagName, usage_count: count });
                            }
                        } catch (error) {
                            console.error(`[Supabase] Error updating tag ${tagName}:`, error);
                        }
                    }
                }

                const searchInput = document.getElementById('searchInput');
                if (searchInput && searchInput.value.trim()) {
                    searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                } else {
                    await renderDiaryList();
                }
                updateTagsList();
                showToast('日記已更新！', 'success');
                return;
            }

            // 上方表單：一律新增
            const diaryEntry = {
                id: Date.now(),
                date: date,
                content: content,
                translation: translation,
                tags: tags,
                images: Array.isArray(imagePaths) ? [...imagePaths] : [],
                isPinned: false,
                createdAt: new Date().toISOString()
            };
            const [withUrls] = await attachSignedImageUrls([diaryEntry]);
            diaries.unshift(withUrls);
            
            if (USE_SUPABASE) {
                console.log('[Supabase] Saving new diary:', { userId, date, content, translation, tags, images: imagePaths });
                const result = await supabaseRequest('diaries', 'POST', {
                    user_id: userId,
                    date: date,
                    content: content,
                    translation: translation || null,
                    tags: tags.length > 0 ? tags : null,
                    images: imagePaths.length > 0 ? imagePaths : [],
                    is_pinned: false
                });
                console.log('[Supabase] Save result:', result);
                if (result && Array.isArray(result) && result[0]) {
                    withUrls.id = result[0].id;
                    console.log('[Supabase] Diary saved with ID:', result[0].id);
                } else {
                    console.error('[Supabase] Failed to save diary, result:', result);
                }
            }

            if (USE_SUPABASE && Object.keys(tagUsage).length > 0) {
                console.log('[Supabase] Updating tags:', tagUsage);
                for (const [tagName, count] of Object.entries(tagUsage)) {
                    try {
                        const existing = await supabaseRequest('tag_usage', 'GET', null, `?user_id=eq.${userId}&tag_name=eq.${tagName}`);
                        if (existing && Array.isArray(existing) && existing.length > 0) {
                            await supabaseRequest('tag_usage', 'PATCH', {
                                usage_count: count
                            }, `?user_id=eq.${userId}&tag_name=eq.${tagName}`);
                        } else {
                            await supabaseRequest('tag_usage', 'POST', {
                                user_id: userId,
                                tag_name: tagName,
                                usage_count: count
                            });
                        }
                    } catch (error) {
                        console.error(`[Supabase] Error updating tag ${tagName}:`, error);
                    }
                }
            }

            localStorage.setItem('diaries', JSON.stringify(diaries));
            localStorage.setItem('tagUsage', JSON.stringify(tagUsage));
            allDiariesSearchCache = null;
            searchCacheUserId = null;
            searchCachePromise = null;

            document.getElementById('diaryInput').value = '';
            autoResizeDiaryInput();
            document.getElementById('translationInput').value = '';
            document.getElementById('translationSection').classList.remove('show');
            document.getElementById('translationSection').style.display = 'none';
            uploadedImages = [];
            updateImagePreview();
            setTodayDate();
            clearDiaryDraft();
            
            document.getElementById('saveBtn').textContent = '儲存日記';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('deleteBtn').style.display = 'none';

            await renderDiaryList();
            updateTagsList();
            
            showToast('日記已儲存！', 'success');
        }

        // 提取標籤（#開頭的詞）
        function extractTags(content) {
            const tagRegex = /#(\w+)/g;
            const tags = [];
            let match;
            
            while ((match = tagRegex.exec(content)) !== null) {
                tags.push(match[1]);
            }
            
            return [...new Set(tags)]; // 去重
        }

        // 當前搜索的標籤
        let currentSearchTag = null;

        // 顯示提示消息（替代alert）
        function showToast(message, type = 'success') {
            // 移除現有的toast
            const existingToast = document.querySelector('.toast-notification');
            if (existingToast) {
                existingToast.remove();
            }

            const toast = document.createElement('div');
            toast.className = `toast-notification ${type}`;
            
            const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
            toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            
            document.body.appendChild(toast);
            
            // 3秒後自動消失
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.remove();
                    }
                }, 300);
            }, 3000);
        }

        // 按標籤搜索日記
        function searchByTag(tag) {
            const searchInput = document.getElementById('searchInput');
            const currentSearchValue = searchInput.value;
            const expectedTagValue = `#${tag}`;
            const currentSearchValueLower = currentSearchValue.toLowerCase();
            const expectedTagValueLower = expectedTagValue.toLowerCase();
            
            // 檢查標籤是否已經在搜尋欄中
            const tagAlreadyExists = currentSearchValueLower.includes(expectedTagValueLower);
            
            // 如果搜尋欄只有這個標籤（沒有其他文字），則清除搜索
            if (currentSearchValue.trim() === expectedTagValue || currentSearchValue.trim().toLowerCase() === expectedTagValueLower) {
                currentSearchTag = null;
                searchInput.value = '';
                // 觸發 input 事件以執行搜尋邏輯（清空搜尋）
                searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                return;
            }
            
            // 如果標籤已經存在於搜尋欄中，則移除它
            if (tagAlreadyExists) {
                // 移除標籤（包括前後的空格）
                let newValue = currentSearchValue;
                // 使用正則表達式移除標籤
                const regex = new RegExp(`\\s*${escapeRegex(expectedTagValue)}\\s*`, 'gi');
                newValue = newValue.replace(regex, ' ').trim();
                searchInput.value = newValue;
                // 觸發 input 事件
                searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                return;
            }

            // 設置當前搜索標籤
            currentSearchTag = tag;
            
            // 在搜索框現有文字後面添加標籤（用空格分隔）
            const cursorPos = searchInput.selectionStart || searchInput.value.length;
            const textBefore = searchInput.value.substring(0, cursorPos);
            const textAfter = searchInput.value.substring(cursorPos);
            
            // 檢查前面是否需要添加空格
            const spaceBefore = textBefore.length === 0 || textBefore[textBefore.length - 1] === ' ' ? '' : ' ';
            // 檢查後面是否需要添加空格
            const spaceAfter = textAfter.length === 0 || textAfter[0] === ' ' ? '' : ' ';
            
            searchInput.value = textBefore + spaceBefore + expectedTagValue + spaceAfter + textAfter;
            
            // 設置游標位置到標籤後面
            const newPos = cursorPos + spaceBefore.length + expectedTagValue.length + spaceAfter.length;
            searchInput.setSelectionRange(newPos, newPos);
            
            // 手動觸發 input 事件，這樣會執行統一的搜尋邏輯
            searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // 添加待辦事項搜尋到搜尋欄
        function addChecklistSearch(type) {
            const searchInput = document.getElementById('searchInput');
            const currentSearchValue = searchInput.value;
            const cursorPos = searchInput.selectionStart || searchInput.value.length;
            const textBefore = searchInput.value.substring(0, cursorPos);
            const textAfter = searchInput.value.substring(cursorPos);
            
            // 根據類型決定搜尋符號
            const searchSymbol = type === 'completed' ? '☑' : '☐';
            const expectedValue = searchSymbol;
            
            // 檢查符號是否已經在搜尋欄中
            const symbolAlreadyExists = currentSearchValue.includes(searchSymbol);
            
            // 如果搜尋欄只有這個符號（沒有其他文字），則清除搜索
            if (currentSearchValue.trim() === expectedValue) {
                searchInput.value = '';
                searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                return;
            }
            
            // 如果符號已經存在於搜尋欄中，則移除它
            if (symbolAlreadyExists) {
                // 移除符號（包括前後的空格）
                let newValue = currentSearchValue;
                const regex = new RegExp(`\\s*${escapeRegex(searchSymbol)}\\s*`, 'g');
                newValue = newValue.replace(regex, ' ').trim();
                searchInput.value = newValue;
                searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                return;
            }
            
            // 檢查前面是否需要添加空格
            const spaceBefore = textBefore.length === 0 || textBefore[textBefore.length - 1] === ' ' ? '' : ' ';
            // 檢查後面是否需要添加空格
            const spaceAfter = textAfter.length === 0 || textAfter[0] === ' ' ? '' : ' ';
            
            searchInput.value = textBefore + spaceBefore + expectedValue + spaceAfter + textAfter;
            
            // 設置游標位置到符號後面
            const newPos = cursorPos + spaceBefore.length + expectedValue.length + spaceAfter.length;
            searchInput.setSelectionRange(newPos, newPos);
            
            // 手動觸發 input 事件，這樣會執行統一的搜尋邏輯
            searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // 更新標籤列表（上方寫作區 + 就地編輯區）
        function updateTagsList() {
            const lists = [
                document.getElementById('tagsList'),
                document.getElementById('inlineTagsList')
            ].filter(Boolean);
            lists.forEach(fillTagsIntoList);
        }

        function fillTagsIntoList(tagsList) {
            tagsList.innerHTML = '';

            const sortedTags = Object.entries(tagUsage)
                .sort((a, b) => b[1] - a[1])
                .map(entry => entry[0]);

            sortedTags.forEach(tag => {
                const tagElement = document.createElement('span');
                if (currentSearchTag === tag) {
                    tagElement.className = 'tag-item search-tag';
                } else {
                    tagElement.className = 'tag-item';
                }
                tagElement.textContent = `#${tag}`;
                tagElement.title = '點擊插入到日記（在日記輸入框外點擊則添加到搜尋欄）';
                // 避免 mousedown 搶走 textarea 焦點，導致游標／選取錯亂
                tagElement.onmousedown = (e) => {
                    if (e.button === 0) e.preventDefault();
                };
                tagElement.onclick = (e) => {
                    if (e.button === 0 || !e.button) {
                        const searchInput = document.getElementById('searchInput');
                        const diaryInput = document.getElementById('diaryInput');
                        const inlineDiaryInput = document.getElementById('inlineDiaryInput');
                        const activeElement = document.activeElement;
                        const editingInline = currentEditingId !== null && !!inlineDiaryInput;
                        const fromInlineTags = tagsList.id === 'inlineTagsList';

                        if (activeElement === searchInput && !fromInlineTags && !editingInline) {
                            searchByTag(tag);
                        } else if (
                            editingInline
                            || fromInlineTags
                            || activeElement === diaryInput
                            || activeElement === inlineDiaryInput
                            || diaryInputActive
                        ) {
                            // 一律插入；不再用「再點一次撤銷」以免過期位置誤刪正文
                            insertTag(tag);
                        } else {
                            searchByTag(tag);
                        }
                    }
                };
                tagElement.oncontextmenu = (e) => {
                    e.preventDefault();
                    insertTag(tag);
                };
                tagsList.appendChild(tagElement);
            });

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'tag-item tag-add-btn';
            addBtn.textContent = '＋ 新增標籤';
            addBtn.title = '新增標籤';
            addBtn.onclick = () => openNewTagComposer(tagsList);
            tagsList.appendChild(addBtn);
        }

        function openNewTagComposer(targetList = null) {
            const tagsList = targetList || document.getElementById('tagsList') || document.getElementById('inlineTagsList');
            if (!tagsList) return;
            const existing = tagsList.querySelector('.tag-composer');
            if (existing) {
                existing.querySelector('input')?.focus();
                return;
            }
            // 關閉另一個列表上可能開著的輸入列
            updateTagsList();
            const freshList = document.getElementById(tagsList.id) || tagsList;
            const addBtn = freshList.querySelector('.tag-add-btn');
            if (addBtn) addBtn.remove();

            const wrap = document.createElement('div');
            wrap.className = 'tag-composer';
            wrap.innerHTML = `
                <input type="text" id="newTagInput" placeholder="標籤名稱（不含#）" maxlength="40" autocomplete="off">
                <button type="button" class="tag-composer-ok" id="newTagConfirmBtn">確認</button>
                <button type="button" class="tag-composer-cancel" id="newTagCancelBtn">取消</button>
            `;
            freshList.appendChild(wrap);

            const input = wrap.querySelector('#newTagInput');
            const confirmBtn = wrap.querySelector('#newTagConfirmBtn');
            const cancelBtn = wrap.querySelector('#newTagCancelBtn');
            input?.focus();
            confirmBtn?.addEventListener('click', () => createNewTag());
            cancelBtn?.addEventListener('click', () => updateTagsList());
            input?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    createNewTag();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    updateTagsList();
                }
            });
        }

        // 初始化日記輸入框活動追蹤
        function initDiaryInputTracking() {
            const diaryInput = document.getElementById('diaryInput');
            const searchInput = document.getElementById('searchInput');
            const dateInput = document.getElementById('dateInput');
            const translationInput = document.getElementById('translationInput');
            if (!diaryInput) return;

            autoResizeDiaryInput();
            
            // 當輸入框獲得焦點、有輸入、或點擊時，標記為活動狀態
            const setActive = () => {
                diaryInputActive = true;
                // 清除之前的定時器
                if (diaryInputActiveTimer) {
                    clearTimeout(diaryInputActiveTimer);
                }
                // 5秒後自動清除活動狀態（如果沒有新的活動）
                diaryInputActiveTimer = setTimeout(() => {
                    diaryInputActive = false;
                }, 5000);
            };
            
            diaryInput.addEventListener('focus', setActive);
            const handleDiaryInputChange = () => {
                setActive();
                autoResizeDiaryInput();
                saveDiarySelection(diaryInput);
                saveDiaryDraft();
            };
            diaryInput.addEventListener('input', handleDiaryInputChange);
            diaryInput.addEventListener('keyup', handleDiaryInputChange);
            diaryInput.addEventListener('paste', handleDiaryInputChange);
            diaryInput.addEventListener('change', handleDiaryInputChange);
            diaryInput.addEventListener('click', () => {
                setActive();
                saveDiarySelection(diaryInput);
            });
            diaryInput.addEventListener('keydown', setActive);
            diaryInput.addEventListener('select', () => saveDiarySelection(diaryInput));
            diaryInput.addEventListener('blur', () => saveDiarySelection(diaryInput));
            
            // 當搜尋欄獲得焦點時，清除日記輸入框的活動狀態
            if (searchInput) {
                searchInput.addEventListener('focus', () => {
                    diaryInputActive = false;
                    if (diaryInputActiveTimer) {
                        clearTimeout(diaryInputActiveTimer);
                    }
                });
            }

            if (dateInput) {
                dateInput.addEventListener('change', saveDiaryDraft);
            }
            if (translationInput) {
                translationInput.addEventListener('input', saveDiaryDraft);
            }
            window.addEventListener('beforeunload', saveDiaryDraft);
            window.addEventListener('pagehide', saveDiaryDraft);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    saveDiaryDraft();
                }
            });
        }

        function getActiveDiaryInputEl() {
            const inline = document.getElementById('inlineDiaryInput');
            if (inline && currentEditingId !== null) return inline;
            return document.getElementById('diaryInput');
        }

        function saveDiarySelection(el = null) {
            const diaryInput = el || getActiveDiaryInputEl();
            if (!diaryInput || typeof diaryInput.selectionStart !== 'number') return;
            savedDiarySelection = {
                start: diaryInput.selectionStart,
                end: diaryInput.selectionEnd,
                elId: diaryInput.id || null
            };
        }

        function getDiaryInsertRange(diaryInput) {
            if (!diaryInput) return { start: 0, end: 0 };
            const focused = document.activeElement === diaryInput;
            if (focused && typeof diaryInput.selectionStart === 'number') {
                return { start: diaryInput.selectionStart, end: diaryInput.selectionEnd };
            }
            if (savedDiarySelection.elId === diaryInput.id) {
                const len = diaryInput.value.length;
                const start = Math.max(0, Math.min(savedDiarySelection.start, len));
                const end = Math.max(start, Math.min(savedDiarySelection.end, len));
                return { start, end };
            }
            const len = diaryInput.value.length;
            return { start: len, end: len };
        }

        function autoResizeDiaryInput(el = null) {
            const diaryInput = el || getActiveDiaryInputEl();
            if (!diaryInput) return;
            // 鎖住頁面捲動，避免量高時（先壓高度）把畫面扯走
            const pageScrollY = window.scrollY || window.pageYOffset || 0;
            diaryInput.style.height = '0px';
            const minHeight = parseFloat(window.getComputedStyle(diaryInput).minHeight) || 0;
            // +2 避免小數取整造成最後一行被裁、出現內部捲軸
            const nextHeight = Math.max(diaryInput.scrollHeight + 2, minHeight);
            diaryInput.style.height = `${nextHeight}px`;
            if ((window.scrollY || window.pageYOffset || 0) !== pageScrollY) {
                window.scrollTo(0, pageScrollY);
            }
        }

        function expandInlineEditorFully() {
            const ta = document.getElementById('inlineDiaryInput');
            if (!ta) return;
            const pageScrollY = window.scrollY || window.pageYOffset || 0;
            autoResizeDiaryInput(ta);
            const translationTa = document.getElementById('inlineTranslationInput');
            if (translationTa) autoResizeDiaryInput(translationTa);
            // 版面／字體就緒後再量一次，確保長文完整展開
            requestAnimationFrame(() => {
                autoResizeDiaryInput(ta);
                if (translationTa) autoResizeDiaryInput(translationTa);
                window.scrollTo(0, pageScrollY);
                requestAnimationFrame(() => {
                    autoResizeDiaryInput(ta);
                    if (translationTa) autoResizeDiaryInput(translationTa);
                    window.scrollTo(0, pageScrollY);
                });
            });
        }

        // 插入標籤到日記
        function insertTag(tag) {
            const diaryInput = getActiveDiaryInputEl();
            if (!diaryInput) return;
            const { start: cursorPos, end: selEnd } = getDiaryInsertRange(diaryInput);
            const textBefore = diaryInput.value.substring(0, cursorPos);
            const textAfter = diaryInput.value.substring(selEnd);

            const spaceBefore = textBefore.length === 0 || /\s$/.test(textBefore) ? '' : ' ';
            const tagText = spaceBefore + `#${tag} `;
            diaryInput.value = textBefore + tagText + textAfter;
            autoResizeDiaryInput(diaryInput);
            saveDiaryDraft();

            const tagEndPos = cursorPos + spaceBefore.length + tag.length + 2;
            diaryInput.focus({ preventScroll: true });
            diaryInput.setSelectionRange(tagEndPos, tagEndPos);
            saveDiarySelection(diaryInput);

            diaryInputActive = true;
            if (diaryInputActiveTimer) clearTimeout(diaryInputActiveTimer);
            diaryInputActiveTimer = setTimeout(() => { diaryInputActive = false; }, 5000);
        }

        // 插入 checklist 到日記
        function insertChecklist() {
            const diaryInput = getActiveDiaryInputEl();
            if (!diaryInput) return;
            const { start: cursorPos, end: selEnd } = getDiaryInsertRange(diaryInput);
            const textBefore = diaryInput.value.substring(0, cursorPos);
            const textAfter = diaryInput.value.substring(selEnd);

            const newlineBefore = textBefore.length === 0 || textBefore[textBefore.length - 1] === '\n' ? '' : '\n';
            const checklistText = newlineBefore + '☐ ';

            diaryInput.value = textBefore + checklistText + textAfter;
            autoResizeDiaryInput(diaryInput);
            saveDiaryDraft();

            const newPos = cursorPos + newlineBefore.length + 2;
            diaryInput.focus({ preventScroll: true });
            diaryInput.setSelectionRange(newPos, newPos);
            saveDiarySelection(diaryInput);

            diaryInputActive = true;
            if (diaryInputActiveTimer) clearTimeout(diaryInputActiveTimer);
            diaryInputActiveTimer = setTimeout(() => { diaryInputActive = false; }, 5000);
        }

        // 創建新標籤
        function createNewTag() {
            const newTagInput = document.getElementById('newTagInput');
            if (!newTagInput) return;
            const tagName = newTagInput.value.trim();
            
            if (!tagName) {
                showToast('請輸入標籤名稱', 'error');
                newTagInput.focus();
                return;
            }

            // 移除標籤名稱中的#符號（如果用戶輸入了）
            const cleanTagName = tagName.replace(/^#+/, '');
            
            // 驗證標籤名稱（只允許字母、數字、中文）
            if (!/^[\w\u4e00-\u9fa5]+$/.test(cleanTagName)) {
                showToast('標籤名稱只能包含字母、數字和中文', 'error');
                return;
            }

            // 如果標籤已存在，增加使用次數；否則創建新標籤
            if (tagUsage[cleanTagName]) {
                tagUsage[cleanTagName] += 1;
            } else {
                tagUsage[cleanTagName] = 1;
            }

            // 保存標籤使用次數
            localStorage.setItem('tagUsage', JSON.stringify(tagUsage));

            // 更新標籤列表（會收合輸入列，並把「新增標籤」排在最後）
            updateTagsList();

            // 可選：自動插入到日記中
            insertTag(cleanTagName);
        }

        // 移除標籤內容（過濾#標籤）
        function removeTagsFromContent(content) {
            // 移除所有 #標籤名 格式的內容
            return content.replace(/#\w+/g, '').replace(/\s+/g, ' ').trim();
        }

        // 翻譯日記
        async function translateDiary() {
            const isInline = currentEditingId !== null && !!document.getElementById('inlineDiaryInput');
            const diaryInput = getActiveDiaryInputEl();
            const content = (diaryInput?.value || '').trim();
            if (!content) {
                alert('請先輸入要翻譯的內容！');
                return;
            }

            const contentWithoutTags = removeTagsFromContent(content);
            
            if (!contentWithoutTags) {
                alert('請輸入除標籤外的內容！');
                return;
            }

            const translationInput = document.getElementById(isInline ? 'inlineTranslationInput' : 'translationInput');
            const translationSection = document.getElementById(isInline ? 'inlineTranslationSection' : 'translationSection');
            if (!translationInput || !translationSection) return;
            
            translationInput.value = '翻譯中...';
            translationSection.classList.add('show');
            translationSection.style.display = 'block';

            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(contentWithoutTags)}&langpair=zh|en`);
                const data = await response.json();
                
                if (data.responseData && data.responseData.translatedText) {
                    translationInput.value = data.responseData.translatedText;
                } else {
                    throw new Error('翻譯失敗');
                }
            } catch (error) {
                console.error('翻譯錯誤:', error);
                translationInput.value = '';
                alert('翻譯服務暫時無法使用，請稍後再試。\n\n提示：您也可以手動輸入英文翻譯。');
            }
        }

        // 格式化日期字符串為中文日期（避免時區轉換問題）
        function formatDateString(dateString) {
            // dateString 格式為 "YYYY-MM-DD"
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]);
            const day = parseInt(parts[2]);
            
            // 創建一個日期對象用於獲取星期幾
            const dateObj = new Date(year, month - 1, day);
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[dateObj.getDay()];
            
            // 使用阿拉伯數字顯示月份
            return `${year}年${month}月${day}日 ${weekday}`;
        }

        // 渲染日記列表
        async function renderDiaryList() {
            const diaryList = document.getElementById('diaryList');

        // 刪除日記
        async function deleteDiary() {
            if (currentEditingId === null) {
                alert('沒有正在編輯的日記！');
                return;
            }

            const editing = diaries[findDiaryIndexById(currentEditingId)];
            const preview = editing?.content
                ? editing.content.trim().slice(0, 40) + (editing.content.trim().length > 40 ? '…' : '')
                : '這篇日記';
            const okConfirm = await askConfirm(
                `確定要刪除「${preview}」嗎？\n此操作無法復原！`,
                '確認刪除日記'
            );
            if (!okConfirm) {
                return;
            }

            // 找到要刪除的日記
            const index = findDiaryIndexById(currentEditingId);
            if (index >= 0) {
                // 先保存被刪除日記的信息（用於更新標籤使用次數）
                const deletedDiary = diaries[index];
                
                // 從 Supabase 刪除
                if (USE_SUPABASE) {
                    await supabaseRequest('diaries', 'DELETE', null, `?id=eq.${currentEditingId}`);
                }
                
                // 從數組中移除
                diaries.splice(index, 1);
                const deletedDiaryId = normalizeDiaryId(currentEditingId);
                if (pinnedDiaryIds[deletedDiaryId]) {
                    delete pinnedDiaryIds[deletedDiaryId];
                    persistPinnedDiaryIds();
                }
                
                // 更新標籤使用次數（減少被刪除日記的標籤使用次數）
                if (deletedDiary && deletedDiary.tags) {
                    const userId = getUserId();
                    deletedDiary.tags.forEach(async tag => {
                        if (tagUsage[tag] && tagUsage[tag] > 0) {
                            tagUsage[tag] -= 1;
                            if (tagUsage[tag] === 0) {
                                delete tagUsage[tag];
                                // 從 Supabase 刪除標籤
                                if (USE_SUPABASE) {
                                    await supabaseRequest('tag_usage', 'DELETE', null, `?user_id=eq.${userId}&tag_name=eq.${tag}`);
                                }
                            } else {
                                // 更新 Supabase 標籤計數
                                if (USE_SUPABASE) {
                                    await supabaseRequest('tag_usage', 'PATCH', {
                                        usage_count: tagUsage[tag]
                                    }, `?user_id=eq.${userId}&tag_name=eq.${tag}`);
                                }
                            }
                        }
                    });
                }
                
                // 儲存到localStorage（作為備份）
                localStorage.setItem('diaries', JSON.stringify(diaries));
                localStorage.setItem('tagUsage', JSON.stringify(tagUsage));
                allDiariesSearchCache = null;
                searchCacheUserId = null;
                searchCachePromise = null;
                
                // 清空就地編輯狀態並重繪
                currentEditingId = null;
                inlineEditImages = [];
                const cancelBtn = document.getElementById('cancelEditBtn');
                const deleteBtn = document.getElementById('deleteBtn');
                const saveBtn = document.getElementById('saveBtn');
                if (cancelBtn) cancelBtn.style.display = 'none';
                if (deleteBtn) deleteBtn.style.display = 'none';
                if (saveBtn) saveBtn.textContent = '儲存日記';
                
                const searchInput = document.getElementById('searchInput');
                if (searchInput && searchInput.value.trim()) {
                    searchInput.dispatchEvent(new Event('input', { bubbles: true }));
                } else {
                    await renderDiaryList();
                }
                updateTagsList();
                
                showToast('日記已刪除！', 'success');
            }
        }

        // 搜尋功能
        document.getElementById('searchInput').addEventListener('input', async function(e) {
            const searchTerm = e.target.value.trim();
            const searchTermLower = searchTerm.toLowerCase();
            
            // 如果搜索框被清空，清除標籤搜索
            if (!searchTerm) {
                currentSearchTag = null;
                const checklistFilterButtons = document.getElementById('checklistFilterButtons');

                    checklistFilterButtons.style.display = 'none';
                }
                checklistFilter = 'all'; // 重置篩選

                setDiaryListLoadingState(USE_SUPABASE ? (hasMoreDiaries ? '往下滾動可載入更多' : '已載入全部日記') : '');
                return;
            }

            // 清除標籤搜索狀態（搜尋框輸入時不再使用特殊標籤搜尋）
            currentSearchTag = null;
            updateTagsList(); // 更新標籤樣式

            let searchBaseDiaries = diaries;
            if (USE_SUPABASE) {
                searchBaseDiaries = await ensureAllDiariesForSearch();
            }

            // 檢查是否搜尋 checklist（顯示篩選按鈕）
            const checklistKeywords = ['checklist', '待辦', '待辦清單', '清單', '📋', '☐', '☑', '- [', '- [x]', '- [ ]'];
            const isSearchingChecklist = checklistKeywords.some(keyword => searchTermLower.includes(keyword) || searchTerm.includes(keyword));
            const checklistFilterButtons = document.getElementById('checklistFilterButtons');
            if (isSearchingChecklist) {
                if (checklistFilterButtons) {
                    checklistFilterButtons.style.display = 'flex';
                }
            } else {
                if (checklistFilterButtons) {
                    checklistFilterButtons.style.display = 'none';
                }
                checklistFilter = 'all'; // 重置篩選
            }

            // 將搜尋字串按空格分割成多個關鍵字（空格代表 AND）
            const allKeywords = searchTermLower.split(/\s+/).filter(keyword => keyword.length > 0);
            
            // 分離正常關鍵字和排除關鍵字（以 ! 開頭）
            const includeKeywords = []; // 必須包含的關鍵字
            const excludeKeywords = []; // 不能包含的關鍵字（以 ! 開頭）
            
            allKeywords.forEach(keyword => {
                if (keyword.startsWith('!')) {
                    // 移除 ! 前綴
                    const excludeKeyword = keyword.substring(1);
                    if (excludeKeyword.length > 0) {
                        excludeKeywords.push(excludeKeyword);
                    }
                } else {
                    includeKeywords.push(keyword);
                }
            });

            // 統一使用普通文字搜尋，一律當成普通字符處理
            const filteredDiaries = searchBaseDiaries.filter(diary => {
                // 搜尋日記內容（直接字串匹配，包含 #標籤名 等所有字符）
                const contentLower = (diary.content || '').toLowerCase();
                // 搜尋翻譯內容
                const translationLower = (diary.translation || '').toLowerCase();
                
                // 合併內容和翻譯用於搜尋
                const searchableText = contentLower + ' ' + translationLower;
                
                // 檢查是否同時包含所有正常關鍵字（AND 邏輯）
                const allIncludeMatch = includeKeywords.length === 0 || includeKeywords.every(keyword => {
                    return searchableText.includes(keyword);
                });
                
                // 檢查是否不包含任何排除關鍵字（NOT 邏輯）
                const allExcludeMatch = excludeKeywords.every(keyword => {
                    return !searchableText.includes(keyword);
                });
                
                return allIncludeMatch && allExcludeMatch;
            });
            
            // 傳遞所有關鍵字用於高亮（只高亮正常關鍵字，不高亮排除關鍵字）
            renderFilteredDiaries(filteredDiaries, includeKeywords);
            setDiaryListLoadingState('');
