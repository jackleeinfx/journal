        function rangeIntersectsLifeTodo(range, editor) {
            if (!range || !editor) return false;
            try {
                return [...editor.querySelectorAll('.life-todo')].some((t) => {
                    try { return range.intersectsNode(t); } catch (e) { return false; }
                });
            } catch (e) {
                return false;
            }
        }

        function insertLifeToggle() {
            const editor = getNoteEditor();
            if (!editor) return;
            restoreNoteSelection();
            editor.focus();
            repairLifeTodos(editor);
            stabilizeLifeToggles(editor);
            normalizeLifeBlockNesting(editor);

            // 同一行：已有待辦勾選 → 禁止再加子級
            if (selectionInsideLifeTodo(editor)) {
                showToast('這一列已是待辦勾選，不能再加子級摺疊', 'error');
                return;
            }

            const sel = window.getSelection();
            let titleHtml = '';
            let range = null;
            if (sel && sel.rangeCount > 0 && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                range = sel.getRangeAt(0);
            }

            if (range) {
                const container = range.commonAncestorContainer;
                const host = container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement;
                if (host?.closest?.('.life-todo')) {
                    showToast('待辦勾選與子級摺疊不能用在同一行', 'error');
                    return;
                }
                if (!range.collapsed && rangeIntersectsLifeTodo(range, editor)) {
                    showToast('選取範圍含有待辦勾選，不能轉成子級摺疊', 'error');
                    return;
                }
            }

            const block = findConvertibleNoteBlock(range, editor);
            if (block?.closest?.('.life-todo') || block?.querySelector?.('.life-todo, .life-todo-check')) {
                showToast('待辦勾選與子級摺疊不能用在同一行', 'error');
                return;
            }

            if (range && sel && !sel.isCollapsed) {
                const frag = range.extractContents();
                const wrap = document.createElement('div');
                wrap.appendChild(frag);
                wrap.querySelectorAll('.life-todo').forEach((todo) => {
                    const textEl = todo.querySelector(':scope > .life-todo-text');
                    if (textEl) {
                        const f = document.createDocumentFragment();
                        while (textEl.firstChild) f.appendChild(textEl.firstChild);
                        todo.replaceWith(f);
                    } else todo.remove();
                });
                wrap.querySelectorAll('.life-todo-check, .life-toggle').forEach((el) => el.remove());
                titleHtml = wrap.innerHTML;
            }

            const toggle = createLifeToggleElement(titleHtml);
            if (range) {
                range.insertNode(toggle);
                const after = document.createRange();
                const titleEl = toggle.querySelector('.life-toggle-title');
                if (titleEl) {
                    after.selectNodeContents(titleEl);
                    after.collapse(false);
                } else {
                    after.setStartAfter(toggle);
                    after.collapse(true);
                }
                sel.removeAllRanges();
                sel.addRange(after);
            } else {
                editor.appendChild(toggle);
            }
            setLifeToggleOpen(toggle, true);
            normalizeLifeBlockNesting(editor);
            markNoteDirty();
            saveNoteSelection();
            const titleEl = toggle.querySelector('.life-toggle-title');
            titleEl?.focus?.();
            showToast('已插入子級，可直接編輯標題與內容', 'info');
        }

        function setLifeTodoChecked(todo, checked) {
            if (!todo) return;
            const on = !!checked;
            todo.setAttribute('data-checked', on ? '1' : '0');
            const box = todo.querySelector(':scope > .life-todo-check');
            if (box) {
                box.setAttribute('contenteditable', 'false');
                box.setAttribute('role', 'checkbox');
                box.setAttribute('aria-checked', on ? 'true' : 'false');
            }
        }

        /**
         * Notion 慣例：待辦與子級摺疊是獨立區塊，不可互相包覆。
         * 若待辦裡出現子級／子級列上出現勾選框，一律拆回平行結構。
         */
        function normalizeLifeBlockNesting(root) {
            if (!root) return;

            // 子級列上誤插入的勾選框直接移除
            root.querySelectorAll('.life-toggle .life-todo-check').forEach((box) => box.remove());

            // 母級標題裡誤嵌的待辦 → 只留文字，拿掉勾選（同一行互斥）
            root.querySelectorAll('.life-toggle-title .life-todo').forEach((todo) => {
                const textEl = todo.querySelector(':scope > .life-todo-text');
                const frag = document.createDocumentFragment();
                if (textEl) {
                    while (textEl.firstChild) frag.appendChild(textEl.firstChild);
                }
                todo.replaceWith(frag);
            });

            // 待辦包住子級 → 把子級整塊移出成兄弟節點
            [...root.querySelectorAll('.life-todo')].forEach((todo) => {
                if (!todo.isConnected) return;
                const textEl = todo.querySelector(':scope > .life-todo-text') || todo;
                const toggles = [...textEl.querySelectorAll('.life-toggle')];
                if (!toggles.length) return;

                const checked = todo.getAttribute('data-checked') === '1';
                let insertAfter = todo;
                toggles.forEach((toggle) => {
                    insertAfter.after(toggle);
                    insertAfter = toggle;
                });

                // 待辦文字區若已空，拿掉這層待辦殼
                if (isVisuallyEmptyBlock(textEl)) {
                    todo.remove();
                } else {
                    setLifeTodoChecked(todo, checked);
                }
            });

            // 若待辦出現在 toggle-row 這種非法位置，移到該 toggle 後面
            root.querySelectorAll('.life-toggle-row .life-todo, .life-toggle-caret .life-todo').forEach((todo) => {
                const toggle = todo.closest('.life-toggle');
                if (toggle) toggle.after(todo);
            });
        }

        function repairLifeTodos(root) {
            if (!root) return;
            normalizeLifeBlockNesting(root);

            root.querySelectorAll('.life-todo').forEach((todo) => {
                if (!todo.isConnected) return;

                // 若整個待辦其實只是包著子級，normalize 後可能已拆；再保險一次
                if (todo.querySelector(':scope > .life-toggle, :scope > .life-todo-text > .life-toggle')) {
                    normalizeLifeBlockNesting(todo.parentNode || root);
                    if (!todo.isConnected) return;
                }

                let check = null;
                let text = null;
                [...todo.children].forEach((child) => {
                    if (child.classList?.contains('life-todo-check')) check = child;
                    if (child.classList?.contains('life-todo-text')) text = child;
                });
                if (!check) {
                    check = document.createElement('span');
                    check.className = 'life-todo-check';
                    todo.insertBefore(check, todo.firstChild);
                }
                check.setAttribute('contenteditable', 'false');
                check.setAttribute('role', 'checkbox');

                if (!text) {
                    text = document.createElement('div');
                    text.className = 'life-todo-text';
                    [...todo.childNodes].forEach((child) => {
                        if (child === check || child === text) return;
                        // 子級不可吸進待辦文字
                        if (child.nodeType === Node.ELEMENT_NODE && child.classList?.contains('life-toggle')) {
                            todo.after(child);
                            return;
                        }
                        text.appendChild(child);
                    });
                    if (!text.childNodes.length) text.innerHTML = '<br>';
                    todo.appendChild(text);
                } else {
                    // 文字區內若還有子級，移出
                    [...text.querySelectorAll(':scope > .life-toggle')].forEach((t) => todo.after(t));
                }

                // 多餘直接子節點（非 check/text）清出去
                [...todo.children].forEach((child) => {
                    if (child === check || child === text) return;
                    if (child.classList?.contains('life-toggle')) {
                        todo.after(child);
                    } else {
                        text.appendChild(child);
                    }
                });

                if (!todo.hasAttribute('data-checked')) todo.setAttribute('data-checked', '0');
                setLifeTodoChecked(todo, todo.getAttribute('data-checked') === '1');
            });

            normalizeLifeBlockNesting(root);
        }

        function createLifeTodoElement(textHtml = '', checked = false) {
            const todo = document.createElement('div');
            todo.className = 'life-todo';
            const check = document.createElement('span');
            check.className = 'life-todo-check';
            check.setAttribute('contenteditable', 'false');
            check.setAttribute('role', 'checkbox');
            const text = document.createElement('div');
            text.className = 'life-todo-text';

            // 禁止把子級 HTML 塞進待辦文字
            let safeHtml = String(textHtml || '');
            if (/life-toggle|life-todo/i.test(safeHtml)) {
                const tmp = document.createElement('div');
                tmp.innerHTML = safeHtml;
                tmp.querySelectorAll('.life-toggle, .life-todo').forEach((el) => el.remove());
                safeHtml = tmp.innerHTML;
            }
            if (safeHtml && safeHtml.trim()) text.innerHTML = safeHtml;
            else text.innerHTML = '<br>';

            todo.appendChild(check);
            todo.appendChild(text);
            setLifeTodoChecked(todo, checked);
            return todo;
        }

        function getLifeTodoContext() {
            const ctx = getNodeFromSelection();
            if (!ctx) return null;
            const { editor, sel, range, node } = ctx;
            // 在子級標題列上不算待辦上下文（避免 Enter／轉換搞壞摺疊）
            if (node.closest?.('.life-toggle-title, .life-toggle-caret')) return null;
            const textEl = node.closest?.('.life-todo-text');
            if (!textEl || !editor.contains(textEl)) return null;
            // 待辦若還錯誤包著子級，不當有效上下文
            if (textEl.querySelector('.life-toggle')) return null;
            const todo = textEl.closest('.life-todo');
            if (!todo || !editor.contains(todo)) return null;
            return { kind: 'todo', el: textEl, textEl, todo, editor, sel, range, node };
        }

        function wrapBareTextAsBlock(editor, textNode) {
            if (!editor || !textNode || textNode.parentNode !== editor) return null;
            const div = document.createElement('div');
            editor.insertBefore(div, textNode);
            div.appendChild(textNode);
            return div;
        }

        function findConvertibleNoteBlock(range, editor) {
            if (!range || !editor) return null;
            let node = range.commonAncestorContainer;
            if (node.nodeType === Node.TEXT_NODE) {
                if (node.parentNode === editor) {
                    return wrapBareTextAsBlock(editor, node);
                }
                node = node.parentElement;
            }
            if (!node || !editor.contains(node)) return null;

            // 子級摺疊本體／標題不可轉成待辦（Notion：兩種獨立 block）
            if (node.closest?.('.life-toggle-title, .life-toggle-caret, .life-toggle-row')) return null;
            if (node.closest?.('.life-toggle') && !node.closest?.('.life-toggle-body')) return null;
            if (node.closest?.('.life-todo')) return null;

            let el = node;
            while (el && el !== editor && el.parentElement !== editor) {
                if (el.parentElement?.classList?.contains('life-toggle-body')) break;
                el = el.parentElement;
            }
            if (!el || el === editor) return null;
            if (el.classList?.contains('life-toggle') || el.classList?.contains('life-todo')) return null;
            if (el.querySelector?.('.life-toggle, .life-todo')) return null;
            if (el.tagName === 'DIV' || el.tagName === 'P') return el;
            return null;
        }

        function rangeIntersectsLifeToggle(range, editor) {
            if (!range || !editor) return false;
            try {
                return [...editor.querySelectorAll('.life-toggle')].some((t) => {
                    try { return range.intersectsNode(t); } catch (e) { return false; }
                });
            } catch (e) {
                return false;
            }
        }

        function insertLifeTodo() {
            const editor = getNoteEditor();
            if (!editor) return;
            restoreNoteSelection();
            editor.focus();
            repairLifeTodos(editor);
            stabilizeLifeToggles(editor);

            const sel = window.getSelection();
            const toggleCtx = getLifeToggleContext();
            if (toggleCtx?.kind === 'title' || selectionInsideLifeToggleTitle(editor)) {
                showToast('這一列已是子級摺疊，不能再加待辦勾選', 'error');
                return;
            }

            // 同一行互斥：選取碰到子級摺疊殼／標題列
            let range = null;
            if (sel && sel.rangeCount > 0 && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
                range = sel.getRangeAt(0);
            }
            if (range && !range.collapsed && rangeIntersectsLifeToggle(range, editor)) {
                showToast('選取範圍含有子級摺疊，不能轉成待辦勾選', 'error');
                return;
            }

            const todoCtx = getLifeTodoContext();
            if (todoCtx?.todo) {
                const next = createLifeTodoElement('', false);
                todoCtx.todo.after(next);
                placeCaretInEmptyBlock(next.querySelector('.life-todo-text'));
                markNoteDirty();
                saveNoteSelection();
                showToast('已新增待辦列', 'info');
                return;
            }

            const block = findConvertibleNoteBlock(range, editor);
            if (block) {
                if (block.querySelector?.('.life-toggle, .life-todo') || block.closest?.('.life-toggle-title, .life-toggle-row')) {
                    showToast('待辦勾選與子級摺疊不能用在同一行', 'error');
                    return;
                }
                const html = isVisuallyEmptyBlock(block) ? '' : block.innerHTML;
                const todo = createLifeTodoElement(html, false);
                block.replaceWith(todo);
                const textEl = todo.querySelector('.life-todo-text');
                if (textEl && sel) {
                    const end = document.createRange();
                    end.selectNodeContents(textEl);
                    end.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(end);
                } else {
                    placeCaretInEmptyBlock(textEl);
                }
                repairLifeTodos(editor);
                markNoteDirty();
                saveNoteSelection();
                showToast('已轉成待辦列，點左側方框可打勾', 'info');
                return;
            }

            // 在子級「內容」中：可另開一列待辦（不是母級同一行）
            if (toggleCtx?.kind === 'body' && range) {
                const bodyBlock = getClosestBlockInBody(toggleCtx.node, toggleCtx.el);
                if (bodyBlock?.classList?.contains('life-todo') || bodyBlock?.closest?.('.life-todo')) {
                    const host = bodyBlock.closest('.life-todo') || bodyBlock;
                    const next = createLifeTodoElement('', false);
                    host.after(next);
                    placeCaretInEmptyBlock(next.querySelector('.life-todo-text'));
                } else if (bodyBlock?.classList?.contains('life-toggle')) {
                    showToast('待辦勾選與子級摺疊不能用在同一行', 'error');
                    return;
                } else {
                    const todo = createLifeTodoElement('', false);
                    if (bodyBlock && bodyBlock.parentElement === toggleCtx.el) bodyBlock.after(todo);
                    else toggleCtx.el.appendChild(todo);
                    placeCaretInEmptyBlock(todo.querySelector('.life-todo-text'));
                }
                repairLifeTodos(editor);
                markNoteDirty();
                saveNoteSelection();
                showToast('已在子級內容插入待辦列', 'info');
                return;
            }

            const todo = createLifeTodoElement('', false);
            if (range) {
                if (!range.collapsed) range.collapse(true);
                const host = range.commonAncestorContainer?.nodeType === Node.ELEMENT_NODE
                    ? range.commonAncestorContainer
                    : range.commonAncestorContainer?.parentElement;
                if (host?.closest?.('.life-toggle-title, .life-toggle-row, .life-toggle-caret')) {
                    showToast('這一列已是子級摺疊，不能再加待辦勾選', 'error');
                    return;
                }
                const ancestorToggle = host?.closest?.('.life-toggle');
                const inBody = host?.closest?.('.life-toggle-body');
                if (ancestorToggle && editor.contains(ancestorToggle) && !inBody) {
                    showToast('待辦勾選與子級摺疊不能用在同一行', 'error');
                    return;
                }
                if (inBody) {
                    const bodyBlock = getClosestBlockInBody(host, inBody);
                    if (bodyBlock && bodyBlock.parentElement === inBody) bodyBlock.after(todo);
                    else inBody.appendChild(todo);
                } else {
                    range.insertNode(todo);
                }
            } else {
                editor.appendChild(todo);
            }
            placeCaretInEmptyBlock(todo.querySelector('.life-todo-text'));
            repairLifeTodos(editor);
            markNoteDirty();
            saveNoteSelection();
            showToast('已插入待辦列，點左側方框可打勾', 'info');
        }

        function selectionInsideLifeToggleTitle(editor) {
            const ctx = getNodeFromSelection();
            if (!ctx || !editor) return false;
            const title = ctx.node.closest?.('.life-toggle-title, .life-toggle-row, .life-toggle-caret');
            return !!(title && editor.contains(title) && !ctx.node.closest?.('.life-toggle-body'));
        }

        function handleLifeTodoClick(e) {
            const editor = getNoteEditor();
            if (!editor) return;
            const box = e.target.closest?.('.life-todo-check');
            if (!box || !editor.contains(box)) return;
            e.preventDefault();
            e.stopPropagation();
            const todo = box.closest('.life-todo');
            if (!todo || !editor.contains(todo)) return;
            // 誤嵌在子級上的勾選：先拆結構再忽略
            if (todo.querySelector('.life-toggle') || box.closest('.life-toggle-row')) {
                normalizeLifeBlockNesting(editor);
                repairLifeTodos(editor);
                markNoteDirty();
                return;
            }
            const checked = todo.getAttribute('data-checked') === '1';
            setLifeTodoChecked(todo, !checked);
            markNoteDirty();
            saveNoteSelection();
        }

        function isCaretAtStartOf(el, range) {
            if (!el || !range || !range.collapsed) return false;
            const probe = document.createRange();
            probe.selectNodeContents(el);
            probe.collapse(true);
            return range.compareBoundaryPoints(Range.START_TO_START, probe) === 0;
        }

        function unwrapLifeTodo(todo) {
            if (!todo || !todo.parentNode) return null;
            const textEl = todo.querySelector(':scope > .life-todo-text');
            const line = document.createElement('div');
            if (textEl && !isVisuallyEmptyBlock(textEl)) {
                while (textEl.firstChild) {
                    if (textEl.firstChild.classList?.contains?.('life-toggle')) {
                        todo.after(textEl.firstChild);
                        continue;
                    }
                    line.appendChild(textEl.firstChild);
                }
            }
            if (!line.childNodes.length) line.innerHTML = '<br>';
            todo.replaceWith(line);
            return line;
        }

        function handleLifeToggleClick(e) {
            const editor = getNoteEditor();
            if (!editor) return;
            const caret = e.target.closest?.('.life-toggle-caret');
            if (!caret || !editor.contains(caret)) return;
            e.preventDefault();
            e.stopPropagation();
            const toggle = caret.closest('.life-toggle');
            if (!toggle || !editor.contains(toggle)) return;
            const open = toggle.getAttribute('data-open') === '1';
            setLifeToggleOpen(toggle, !open);
            markNoteDirty();
            saveNoteSelection();
        }

        function getNodeFromSelection() {
            const editor = getNoteEditor();
            const sel = window.getSelection();
            if (!editor || !sel || !sel.rangeCount) return null;
            const range = sel.getRangeAt(0);
            if (!editor.contains(range.commonAncestorContainer)) return null;
            let node = range.commonAncestorContainer;
            if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
            if (!node || !editor.contains(node)) return null;
            return { editor, sel, range, node };
        }

        function getLifeToggleContext() {
            const ctx = getNodeFromSelection();
            if (!ctx) return null;
            const { editor, sel, range, node } = ctx;
            const title = node.closest('.life-toggle-title');
            if (title && editor.contains(title)) {
                return { kind: 'title', el: title, toggle: title.closest('.life-toggle'), editor, sel, range, node };
            }
            const body = node.closest('.life-toggle-body');
            if (body && editor.contains(body)) {
                return { kind: 'body', el: body, toggle: body.closest('.life-toggle'), editor, sel, range, node };
            }
            return null;
        }

        function getLifeTogglePasteTarget() {
            const ctx = getLifeToggleContext();
            if (ctx) return { kind: ctx.kind, el: ctx.el, toggle: ctx.toggle, range: ctx.range };
            const base = getNodeFromSelection();
            if (!base) return null;
            const { editor, range, node } = base;
            const toggle = node.closest('.life-toggle');
            if (toggle && editor.contains(toggle) && !node.closest('.life-toggle-caret')) {
                let bodyEl = toggle.querySelector(':scope > .life-toggle-body');
                if (!bodyEl) {
                    bodyEl = document.createElement('div');
                    bodyEl.className = 'life-toggle-body';
                    bodyEl.innerHTML = '<div><br></div>';
                    toggle.appendChild(bodyEl);
                }
                const end = document.createRange();
                end.selectNodeContents(bodyEl);
                end.collapse(false);
                return { kind: 'body', el: bodyEl, toggle, range: end };
            }
            return null;
        }

        function placeCaretInEmptyBlock(block) {
            const sel = window.getSelection();
            if (!sel || !block) return;
            const range = document.createRange();
            range.selectNodeContents(block);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function placeCaretAfterNode(node) {
            const sel = window.getSelection();
            if (!sel || !node) return;
            const range = document.createRange();
            range.setStartAfter(node);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        /** Notion 慣例：在標題按 Enter → 整塊子級之後新建「無關」的新行 */
        function insertBlockAfterToggle(toggle) {
            if (!toggle || !toggle.parentNode) return null;
            const line = document.createElement('div');
            line.innerHTML = '<br>';
            toggle.after(line);
            placeCaretInEmptyBlock(line);
            return line;
        }

        /**
         * 刪除子級摺疊殼，保留 body 內原有內容（移到外面當一般區塊）。
         * 母級標題已空時由 Backspace 觸發。
         */
        function unwrapLifeToggleKeepChildren(toggle) {
            if (!toggle || !toggle.parentNode) return null;
            const body = toggle.querySelector(':scope > .life-toggle-body');
            const frag = document.createDocumentFragment();
            let first = null;

            if (body) {
                while (body.firstChild) {
                    if (!first) first = body.firstChild;
                    frag.appendChild(body.firstChild);
                }
            }

            if (!frag.childNodes.length) {
                const line = document.createElement('div');
                line.innerHTML = '<br>';
                frag.appendChild(line);
                first = line;
            }

            toggle.replaceWith(frag);
            return first;
        }

        function placeCaretAtStartOfNode(node) {
            const sel = window.getSelection();
            if (!sel || !node) return;
            const target = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
            if (!target) return;
            // 待辦列：游標進文字區
            const textEl = target.classList?.contains('life-todo')
                ? target.querySelector(':scope > .life-todo-text')
                : (target.classList?.contains('life-todo-text') ? target : null);
            const block = textEl || target;
            const range = document.createRange();
            range.selectNodeContents(block);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        function isVisuallyEmptyBlock(el) {
            if (!el) return true;
            const text = (el.textContent || '').replace(/\u200B/g, '').trim();
            if (text) return false;
            // 只有 br / 空白
            return !el.querySelector('.life-date, .life-hl, img, .life-toggle, .life-todo');
        }

        function getClosestBlockInBody(node, body) {
            let el = node?.nodeType === Node.TEXT_NODE ? node.parentElement : node;
            while (el && el !== body && el.parentElement !== body) {
                el = el.parentElement;
            }
            if (el && el.parentElement === body) return el;
            if (el === body) return body.lastElementChild || body;
            return body.lastElementChild || body;
        }

        function stabilizeLifeToggles(root) {
            const host = root || getNoteEditor();
            if (!host) return;
            repairLifeToggles(host);
            host.querySelectorAll('.life-toggle').forEach((toggle) => {
                const row = toggle.querySelector(':scope > .life-toggle-row');
                const body = toggle.querySelector(':scope > .life-toggle-body');
                if (!body) return;
                [...toggle.childNodes].forEach((child) => {
                    if (child === row || child === body) return;
                    if (child.nodeType === Node.TEXT_NODE && !String(child.textContent || '').trim()) {
                        child.remove();
                        return;
                    }
                    body.appendChild(child);
                });
                // 標題內不要殘留區塊級元素（Enter 拆壞時）
                const title = row?.querySelector(':scope > .life-toggle-title');
                if (title) {
                    [...title.querySelectorAll('div, p')].forEach((block) => {
                        const span = document.createElement('span');
                        while (block.firstChild) span.appendChild(block.firstChild);
                        block.replaceWith(span);
                        span.after(document.createTextNode(' '));
                    });
                }
            });
        }

        function flattenLifeTogglesInContainer(container) {
            if (!container) return;
            container.querySelectorAll('.life-toggle').forEach((t) => {
                const frag = document.createDocumentFragment();
                const title = t.querySelector(':scope > .life-toggle-row > .life-toggle-title');
                const body = t.querySelector(':scope > .life-toggle-body');
                if (title) {
                    const div = document.createElement('div');
                    while (title.firstChild) div.appendChild(title.firstChild);
                    if (!div.childNodes.length) div.appendChild(document.createElement('br'));
                    frag.appendChild(div);
                }
                if (body) {
                    while (body.firstChild) frag.appendChild(body.firstChild);
                }
                t.replaceWith(frag);
            });
        }

        function isClipboardEmptyBlockNode(node) {
            if (!node) return true;
            if (node.nodeType === Node.TEXT_NODE) return !String(node.textContent || '').trim();
            if (node.nodeType !== Node.ELEMENT_NODE) return true;
            if (node.classList?.contains('life-date') || node.classList?.contains('life-hl')) return false;
            if (node.classList?.contains('life-todo') || node.classList?.contains('life-toggle')) return false;
            const tag = node.tagName;
            if (tag !== 'DIV' && tag !== 'P' && tag !== 'SPAN' && tag !== 'BR') {
                return !(node.textContent || '').replace(/\u200B/g, '').trim();
            }
            if (tag === 'BR') return true;
            return isVisuallyEmptyBlock(node);
        }

        function trimEmptyBlocksFromContainer(container) {
            if (!container) return;
            while (container.firstChild && isClipboardEmptyBlockNode(container.firstChild)) {
                container.removeChild(container.firstChild);
            }
            while (container.lastChild && isClipboardEmptyBlockNode(container.lastChild)) {
                container.removeChild(container.lastChild);
            }
        }

        function extractPlainTextFromClipboard(html, text) {
            const fromText = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            if (fromText.trim()) return fromText.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = sanitizeNoteHtml(html);
            return (tmp.textContent || '').replace(/\s+/g, ' ').trim();
        }

        function cleanupEmptySiblingsAroundToggle(toggle, originalPrev, originalNext) {
            if (!toggle || !toggle.parentNode) return;
            const parent = toggle.parentNode;
            // 上方：貼上前～toggle 之間新長出的空白行
            let n = originalPrev ? originalPrev.nextSibling : parent.firstChild;
            while (n && n !== toggle) {
                const next = n.nextSibling;
                if (isClipboardEmptyBlockNode(n)) n.remove();
                n = next;
            }
            // 下方：toggle～貼上前下一個兄弟之間的空白／被撐出的內容
            const title = toggle.querySelector(':scope > .life-toggle-row > .life-toggle-title');
            n = toggle.nextSibling;
            while (n && n !== originalNext) {
                const next = n.nextSibling;
                if (n.nodeType === Node.ELEMENT_NODE && n.classList?.contains('life-toggle')) break;
                if (isClipboardEmptyBlockNode(n)) {
                    n.remove();
                } else if (title && (n.textContent || '').trim()) {
                    // 標題貼上時被撐到外面的文字收回標題
                    const t = (n.textContent || '').replace(/\s+/g, ' ').trim();
                    if (t) title.appendChild(document.createTextNode((title.textContent || '').trim() ? ` ${t}` : t));
                    n.remove();
                } else {
                    break;
                }
                n = next;
            }
        }

        function buildFragmentFromClipboard(html, text, { inlineOnly = false, flattenToggles = false } = {}) {
            const frag = document.createDocumentFragment();
            if (html && html.trim()) {
                const tmp = document.createElement('div');
                tmp.innerHTML = sanitizeNoteHtml(html);
                if (flattenToggles) flattenLifeTogglesInContainer(tmp);
                tmp.querySelectorAll('font').forEach((el) => {
                    const span = document.createElement('span');
                    while (el.firstChild) span.appendChild(el.firstChild);
                    el.replaceWith(span);
                });
                trimEmptyBlocksFromContainer(tmp);
                if (inlineOnly) {
                    // 標題禁止插入區塊元素，只取純文字
                    const plain = (tmp.textContent || '').replace(/\s+/g, ' ').trim();
                    if (plain) frag.appendChild(document.createTextNode(plain));
                    return frag;
                }
                while (tmp.firstChild) frag.appendChild(tmp.firstChild);
                return frag;
            }
            const normalized = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            if (inlineOnly) {
                const plain = normalized.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
                if (plain) frag.appendChild(document.createTextNode(plain));
                return frag;
            }
            const lines = normalized.split('\n');
            // 去掉首尾空行，避免貼上憑空多行
            while (lines.length && !lines[0].trim()) lines.shift();
            while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
            if (lines.length <= 1) {
                frag.appendChild(document.createTextNode(lines[0] || ''));
                return frag;
            }
            lines.forEach((line) => {
                const div = document.createElement('div');
                if (line) div.textContent = line;
                else div.appendChild(document.createElement('br'));
                frag.appendChild(div);
            });
            return frag;
        }

        function insertFragmentAtRange(range, frag) {
            if (!range || !frag) return null;
            range.deleteContents();
            const last = frag.lastChild;
            range.insertNode(frag);
            return last;
        }

        function reclaimPasteOverflowIntoToggle(toggle, body, stopBeforeNode) {
            if (!toggle || !body) return;
            let node = toggle.nextSibling;
            while (node && node !== stopBeforeNode) {
                const next = node.nextSibling;
                if (node.nodeType === Node.ELEMENT_NODE && node.classList.contains('life-toggle')) break;
                if (isClipboardEmptyBlockNode(node)) {
                    node.remove();
                } else {
                    body.appendChild(node);
                }
                node = next;
            }
            const row = toggle.querySelector(':scope > .life-toggle-row');
            [...toggle.children].forEach((child) => {
                if (child === row || child === body) return;
                body.appendChild(child);
            });
        }

        function handleLifeNotePaste(e) {
            const editor = getNoteEditor();
            if (!editor) return;
            // 生活紀錄一律純文字貼上（不要顏色／字體／大小）
            const text = e.clipboardData?.getData('text/plain') || '';
            if (!text) {
                e.preventDefault();
                e.stopPropagation();
                return;
            }

            e.preventDefault();
            e.stopPropagation();

            const target = getLifeTogglePasteTarget();
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) return;

            if (target?.kind === 'title') {
                const plain = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
                const originalPrev = target.toggle.previousSibling;
                const originalNext = target.toggle.nextSibling;
                target.range.deleteContents();
                if (plain) {
                    const node = document.createTextNode(plain);
                    target.range.insertNode(node);
                    placeCaretAfterNode(node);
                }
                cleanupEmptySiblingsAroundToggle(target.toggle, originalPrev, originalNext);
            } else if (target?.kind === 'body') {
                setLifeToggleOpen(target.toggle, true);
                const originalPrev = target.toggle.previousSibling;
                const stopBefore = target.toggle.nextSibling;
                const frag = buildFragmentFromClipboard('', text, { inlineOnly: false, flattenToggles: true });
                const last = insertFragmentAtRange(target.range, frag);
                reclaimPasteOverflowIntoToggle(target.toggle, target.el, stopBefore);
                cleanupEmptySiblingsAroundToggle(target.toggle, originalPrev, stopBefore);
                if (last && editor.contains(last)) placeCaretAfterNode(last);
            } else {
                const range = sel.getRangeAt(0);
                const frag = buildFragmentFromClipboard('', text, { inlineOnly: false, flattenToggles: false });
                const last = insertFragmentAtRange(range, frag);
                if (last) placeCaretAfterNode(last);
            }

            stabilizeLifeToggles(editor);
            markNoteDirty();
            saveNoteSelection();
        }

        function handleLifeNoteKeydown(e) {
            const editor = getNoteEditor();
            if (!editor) return;

            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                const todoCtx = getLifeTodoContext();
                if (todoCtx?.todo) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (isVisuallyEmptyBlock(todoCtx.textEl)) {
                        const line = unwrapLifeTodo(todoCtx.todo);
                        if (line) placeCaretInEmptyBlock(line);
                    } else {
                        const next = createLifeTodoElement('', false);
                        todoCtx.todo.after(next);
                        placeCaretInEmptyBlock(next.querySelector('.life-todo-text'));
                    }
                    repairLifeTodos(editor);
                    markNoteDirty();
                    saveNoteSelection();
                    return;
                }

                // Enter：標題 → 跳出子級後面新行；body 內 → 在內部加行
                const ctx = getLifeToggleContext();
                if (!ctx?.toggle) return;

                if (ctx.kind === 'title') {
                    e.preventDefault();
                    e.stopPropagation();
                    insertBlockAfterToggle(ctx.toggle);
                    stabilizeLifeToggles(editor);
                    markNoteDirty();
                    saveNoteSelection();
                    return;
                }

                if (ctx.kind === 'body') {
                    // 子級內容：Enter 一律在內部加行，不跳出（跳出只靠母級標題 Enter）
                    e.preventDefault();
                    e.stopPropagation();
                    const block = getClosestBlockInBody(ctx.node, ctx.el);
                    const newLine = document.createElement('div');
                    newLine.innerHTML = '<br>';
                    if (block && block.parentElement === ctx.el) {
                        block.after(newLine);
                    } else {
                        ctx.el.appendChild(newLine);
                    }
                    placeCaretInEmptyBlock(newLine);
                    markNoteDirty();
                    saveNoteSelection();
                }
                return;
            }

            if (e.key === 'Backspace' && !e.isComposing) {
                const todoCtx = getLifeTodoContext();
                if (todoCtx?.todo && todoCtx.sel?.isCollapsed && isCaretAtStartOf(todoCtx.textEl, todoCtx.range)) {
                    e.preventDefault();
                    e.stopPropagation();
                    const line = unwrapLifeTodo(todoCtx.todo);
                    if (line) placeCaretInEmptyBlock(line);
                    markNoteDirty();
                    saveNoteSelection();
                    return;
                }

                // 母級標題刪到空後再按 Backspace → 拆掉子級系統，保留子級內文字
                const ctx = getLifeToggleContext();
                if (ctx?.kind === 'title' && ctx.sel?.isCollapsed && isVisuallyEmptyBlock(ctx.el)) {
                    e.preventDefault();
                    e.stopPropagation();
                    const first = unwrapLifeToggleKeepChildren(ctx.toggle);
                    if (first) placeCaretAtStartOfNode(first);
                    stabilizeLifeToggles(editor);
                    repairLifeTodos(editor);
                    normalizeLifeBlockNesting(editor);
                    markNoteDirty();
                    saveNoteSelection();
                }
            }
        }

        function fillNoteDateSelects() {
            const ySel = document.getElementById('noteDateYear');
            const mSel = document.getElementById('noteDateMonth');
            const dSel = document.getElementById('noteDateDay');
            if (!ySel || !mSel || !dSel || ySel.dataset.ready === '1') return;
            ySel.dataset.ready = '1';
            const now = new Date();
            const yNow = now.getFullYear();
            ySel.innerHTML = '';
            for (let y = yNow - 5; y <= yNow + 20; y++) {
                const opt = document.createElement('option');
                opt.value = String(y);
                opt.textContent = String(y);
                if (y === yNow) opt.selected = true;
                ySel.appendChild(opt);
            }
            mSel.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = String(m);
                opt.textContent = String(m);
                if (m === now.getMonth() + 1) opt.selected = true;
                mSel.appendChild(opt);
            }
            const rebuildDays = () => {
                const y = parseInt(ySel.value, 10);
                const m = parseInt(mSel.value, 10);
                const max = new Date(y, m, 0).getDate();
                const prev = parseInt(dSel.value, 10) || now.getDate();
                dSel.innerHTML = '';
                for (let d = 1; d <= max; d++) {
                    const opt = document.createElement('option');
                    opt.value = String(d);
                    opt.textContent = String(d);
                    if (d === Math.min(prev, max)) opt.selected = true;
                    dSel.appendChild(opt);
                }
            };
            ySel.addEventListener('change', rebuildDays);
            mSel.addEventListener('change', rebuildDays);
            ySel._rebuildDays = rebuildDays;
            rebuildDays();
        }

        function resetNoteDateSelectsToToday() {
            fillNoteDateSelects();
            const ySel = document.getElementById('noteDateYear');
            const mSel = document.getElementById('noteDateMonth');

            if (!ySel || !mSel || !dSel) return;
            const now = new Date();
            ySel.value = String(now.getFullYear());
            mSel.value = String(now.getMonth() + 1);
            if (typeof ySel._rebuildDays === 'function') ySel._rebuildDays();
            dSel.value = String(now.getDate());
        }

        function unwrapNoteElement(el) {
            if (!el || !el.parentNode) return;
            const parent = el.parentNode;
            while (el.firstChild) parent.insertBefore(el.firstChild, el);
            parent.removeChild(el);
            parent.normalize?.();
        }

        function applyNoteHighlight(color) {
            const editor = getNoteEditor();
            if (!editor) return;
            restoreNoteSelection();
            editor.focus();
            const sel = window.getSelection();
            if (!sel || sel.isCollapsed || !sel.rangeCount) {
                showToast('請先選取要圈選的文字', 'error');
                return;
            }
            const range = sel.getRangeAt(0);
            const span = document.createElement('span');
            span.className = 'life-hl';
            span.style.borderColor = color;
            try {
                range.surroundContents(span);
            } catch (e) {
                span.appendChild(range.extractContents());
                range.insertNode(span);
            }
            // 選取剛圈起來的內容，方便連續操作
            sel.removeAllRanges();
            const after = document.createRange();
            after.selectNodeContents(span);
            sel.addRange(after);
            markNoteDirty();
            saveNoteSelection();
        }

        function clearNoteHighlight() {
            const editor = getNoteEditor();
            if (!editor) return;
            restoreNoteSelection();
            editor.focus();
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) {
                showToast('請先選取要清除外框的文字', 'error');
                return;
            }
            const range = sel.getRangeAt(0);

            // 若游標在外框內，清掉該外框
            let node = sel.anchorNode;
            if (node && node.nodeType === Node.TEXT_NODE) node = node.parentElement;
            const wrapping = node?.closest?.('.life-hl');
            if (wrapping && editor.contains(wrapping) && (sel.isCollapsed || wrapping.contains(range.commonAncestorContainer) || range.intersectsNode?.(wrapping))) {
                unwrapNoteElement(wrapping);
                markNoteDirty();
                saveNoteSelection();
                return;
            }

            if (sel.isCollapsed) {
                showToast('請先選取要清除外框的文字', 'error');
                return;
            }

            const targets = [...editor.querySelectorAll('.life-hl')].filter((el) => {
                try {
                    return range.intersectsNode(el);
                } catch (e) {
                    return sel.containsNode(el, true);
                }
            });
            if (!targets.length) {
                // 也可能選取內容整個包在一個 life-hl 裡
                const ancestor = range.commonAncestorContainer?.nodeType === 1
                    ? range.commonAncestorContainer.closest?.('.life-hl')
                    : range.commonAncestorContainer?.parentElement?.closest?.('.life-hl');
                if (ancestor && editor.contains(ancestor)) targets.push(ancestor);
            }
            if (!targets.length) {
                showToast('選取範圍內沒有外框', 'error');
                return;
            }
            targets.forEach(unwrapNoteElement);
            markNoteDirty();
            saveNoteSelection();
        }

        function nodeContainsDate(node, dateNode) {
            return node === dateNode || (node.nodeType === 1 && node.contains(dateNode));
        }

        function textFromNodes(nodes) {
            const tmp = document.createElement('div');
            nodes.forEach((n) => tmp.appendChild(n.cloneNode(true)));
            return (tmp.innerText || tmp.textContent || '').replace(/\s+/g, ' ').trim();
        }

        // 只取「含這個日期標記」的那一視覺行（以 <br> 或區塊邊界切開）
        function getVisualLineTextForDate(dateNode, editor) {
            if (!dateNode || !editor) return '';

            let block = dateNode.parentElement;
            while (block && block !== editor) {
                if (['DIV', 'P', 'LI'].includes(block.tagName)) break;
                block = block.parentElement;
            }
            if (!block) block = editor;

            const children = [...block.childNodes];
            if (children.some((n) => n.nodeName === 'BR')) {
                let group = [];
                const groups = [];
                children.forEach((n) => {
                    if (n.nodeName === 'BR') {
                        groups.push(group);
                        group = [];
                    } else {
                        group.push(n);
                    }
                });
                groups.push(group);
                const hit = groups.find((g) => g.some((n) => nodeContainsDate(n, dateNode)));
                return hit ? textFromNodes(hit) : '';
            }

            const nestedBlocks = [...block.children].filter((el) =>
                ['DIV', 'P', 'LI'].includes(el.tagName)
            );
            if (nestedBlocks.length >= 1) {
                const hit = nestedBlocks.find((el) => el.contains(dateNode));
                if (hit && hit !== block) {
                    // 若命中子區塊，只取該子區塊內、再依 br 切出的那一行
                    const innerChildren = [...hit.childNodes];
                    if (innerChildren.some((n) => n.nodeName === 'BR')) {
                        let group = [];
                        const groups = [];
                        innerChildren.forEach((n) => {
                            if (n.nodeName === 'BR') {
                                groups.push(group);
                                group = [];
                            } else {
                                group.push(n);
                            }
                        });
                        groups.push(group);
                        const line = groups.find((g) => g.some((n) => nodeContainsDate(n, dateNode)));
                        return line ? textFromNodes(line) : (hit.innerText || '').replace(/\s+/g, ' ').trim();
                    }
                    return (hit.innerText || hit.textContent || '').replace(/\s+/g, ' ').trim();
                }
            }

            // 單一區塊、無 br：整塊就是一行（若有換行符則再切開）
            if (block !== editor) {
                const full = (block.innerText || block.textContent || '').replace(/\r/g, '');
                if (full.includes('\n')) {
                    const label = (dateNode.textContent || '').trim();
                    const hitLine = full.split('\n').map((l) => l.trim()).find((l) => l && label && l.includes(label));
                    if (hitLine) return hitLine.replace(/\s+/g, ' ').trim();
                }
                return full.replace(/\s+/g, ' ').trim();
            }

            // 退而求其次：以日期前後文字節點組成一行（不含跨行）
            return (dateNode.textContent || '').trim();
        }

        function extractDatedLinesFromHtml(html) {
            const root = document.createElement('div');
            root.className = 'records-note-editor';
            root.innerHTML = sanitizeNoteHtml(html || '');
            // 收合的子級也要納入提醒：暫時全部展開再抽日期行
            root.querySelectorAll('.life-toggle').forEach((t) => {
                t.setAttribute('data-open', '1');
                const body = t.querySelector(':scope > .life-toggle-body');
                if (body) body.style.display = 'block';
            });
            const lines = [];
            const seen = new Set();

            root.querySelectorAll('.life-date[data-date]').forEach((dateNode) => {
                const iso = dateNode.getAttribute('data-date');
                if (!iso) return;
                const text = getVisualLineTextForDate(dateNode, root);
                if (!text) return;
                const key = iso + '|' + text;
                if (seen.has(key)) return;
                seen.add(key);
                lines.push({ date: iso, dates: [iso], text });
            });

            return lines.sort((a, b) => a.date.localeCompare(b.date));
        }

        function extractDatedLinesFromEditor() {
            const editor = getNoteEditor();
            if (!editor) return [];
            return extractDatedLinesFromHtml(editor.innerHTML);
        }

        function stripDateFromReminderText(text, iso) {
            const dateLabel = formatNoteDateLabel(iso);
            let lineText = text || '';
            if (dateLabel) lineText = lineText.split(dateLabel).join('   ');
            return lineText.replace(/\s{4,}/g, '   ').replace(/^\s+|\s+$/g, '');
        }

        function collectAllLifeReminders() {
            const items = [];
            const seen = new Set();
            lifeCategories.forEach((cat) => {
                const note = lifeNotesByCategory[String(cat.id)];
                if (!note?.content) return;
                extractDatedLinesFromHtml(note.content).forEach((line) => {
                    const key = `${cat.id}|${line.date}|${line.text}`;
                    if (seen.has(key)) return;
                    seen.add(key);
                    items.push({
                        date: line.date,
                        text: line.text,
                        displayText: stripDateFromReminderText(line.text, line.date),
                        categoryId: cat.id,
                        categoryName: cat.name
                    });
                });
            });
            return items.sort((a, b) => {
                const d = String(a.date).localeCompare(String(b.date));
                if (d !== 0) return d;
                return String(a.categoryName || '').localeCompare(String(b.categoryName || ''), 'zh');
            });
        }

        function lifeReminderDatesSet() {
            return new Set(collectAllLifeReminders().map((r) => r.date).filter(Boolean));
        }

        function getLifeReminderUrgency(iso) {
            const today = toDateInputValue(new Date());
            const days = Math.round(
                (new Date(iso + 'T12:00:00') - new Date(today + 'T12:00:00')) / 86400000
            );
            if (days < 0) return { days, cls: ' is-overdue', tag: `已過期 ${Math.abs(days)} 天` };
            if (days === 0) return { days, cls: ' is-soon', tag: '今天' };
            if (days <= NOTE_REMINDER_SOON_DAYS) return { days, cls: ' is-soon', tag: `還剩 ${days} 天` };
            return { days, cls: '', tag: `還剩 ${days} 天` };
        }

        async function persistCategoryOrder() {
            lifeCategories.forEach((c, i) => { c.sort_order = i + 1; });
            const results = await Promise.all(
                lifeCategories.map((c) =>
                    supabaseRequest('life_categories', 'PATCH', { sort_order: c.sort_order }, `?id=eq.${c.id}`)
                )
            );
            if (results.some((r) => !r || (Array.isArray(r) && r.length === 0))) {
                showToast('排序儲存失敗', 'error');
                return false;
            }
            return true;
        }

        function reorderCategoriesByIds(fromId, toId, placeAfter) {
            const fromIdx = lifeCategories.findIndex((c) => Number(c.id) === Number(fromId));
            const toIdx = lifeCategories.findIndex((c) => Number(c.id) === Number(toId));
            if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return false;
            const [item] = lifeCategories.splice(fromIdx, 1);
            let insertAt = lifeCategories.findIndex((c) => Number(c.id) === Number(toId));
            if (placeAfter) insertAt += 1;
            lifeCategories.splice(insertAt, 0, item);
            return true;
        }

        async function deleteCategoryById(id) {
            const cat = lifeCategories.find((c) => Number(c.id) === Number(id));
            if (!cat) return;
            const ok = await askConfirm(
                `確定要刪除分類「${cat.name}」嗎？\n此分類下的筆記也會一併刪除，無法復原。`,
                '確認刪除分類'
            );
            if (!ok) return;

            const deleted = await supabaseRequest('life_categories', 'DELETE', null, `?id=eq.${id}`);
            if (!deleted) {
                showToast('刪除分類失敗', 'error');
                return;
            }

            const wasSelected = Number(recordsSelectedCategoryId) === Number(id);
            lifeCategories = lifeCategories.filter((c) => Number(c.id) !== Number(id));
            delete lifeNotesByCategory[String(id)];

            if (!lifeCategories.length) {
                await seedDefaultCategoriesIfEmpty();
            } else {
                await persistCategoryOrder();
            }

            if (wasSelected || !lifeCategories.some((c) => Number(c.id) === Number(recordsSelectedCategoryId))) {
                const nextId = lifeCategories[0]?.id || null;
                if (nextId) await switchLifeCategory(nextId);
                else {
                    recordsSelectedCategoryId = null;
                    showCategoryNote(null);
                }
            } else {
                renderCategoryBar();

            renderEditCategoriesList();
            showToast('分類已刪除', 'success');
        }

        function initEditCategoryDrag(listEl) {
            if (!listEl || listEl.dataset.dragReady === '1') return;
            listEl.dataset.dragReady = '1';
            let dragId = null;

            listEl.addEventListener('dragstart', (e) => {
                const chip = e.target.closest('.edit-cat-chip');
                if (!chip || e.target.closest('[data-cat-delete]')) {
                    e.preventDefault();
                    return;
                }
                dragId = chip.dataset.catEditId;
                chip.classList.add('is-dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', dragId);
            });

            listEl.addEventListener('dragend', (e) => {
                const chip = e.target.closest('.edit-cat-chip');
                chip?.classList.remove('is-dragging');
                listEl.querySelectorAll('.drag-over').forEach((el) => el.classList.remove('drag-over'));
                dragId = null;
            });

            listEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                const over = e.target.closest('.edit-cat-chip');
                listEl.querySelectorAll('.drag-over').forEach((el) => el.classList.remove('drag-over'));
                if (over && over.dataset.catEditId !== String(dragId)) {
                    over.classList.add('drag-over');
                }
                e.dataTransfer.dropEffect = 'move';
            });

            listEl.addEventListener('drop', async (e) => {
                e.preventDefault();
                const over = e.target.closest('.edit-cat-chip');
                listEl.querySelectorAll('.drag-over').forEach((el) => el.classList.remove('drag-over'));
                const fromId = dragId || e.dataTransfer.getData('text/plain');
                if (!over || !fromId) return;
                const toId = over.dataset.catEditId;
                if (String(fromId) === String(toId)) return;

                const rect = over.getBoundingClientRect();
                const placeAfter = e.clientX > rect.left + rect.width / 2;
                if (!reorderCategoriesByIds(fromId, toId, placeAfter)) return;
                renderEditCategoriesList();
                await persistCategoryOrder();
                renderCategoryBar();
            });
        }

        async function confirmAddCategory() {
            if (!currentUserId) {
                showToast('請先登入', 'error');
                return;
            }
            const input = document.getElementById('newCategoryNameInput');
            const name = (input?.value || '').trim();
            if (!name) {
                showToast('請輸入分類名稱', 'error');
                input?.focus();
                return;
            }
            if (name.length > 40) {
                showToast('分類名稱請勿超過 40 字', 'error');
                return;
            }
            if (lifeCategories.some((c) => c.name === name)) {
                showToast('分類已存在', 'error');
                return;
            }
            const sort_order = lifeCategories.length
                ? Math.max(...lifeCategories.map((c) => Number(c.sort_order) || 0)) + 1
                : 1;
            const result = await supabaseRequest('life_categories', 'POST', {
                user_id: currentUserId,
                name,
                sort_order
            });
            if (!result || (Array.isArray(result) && result.length === 0)) {
                showToast('新增分類失敗', 'error');
                return;
            }
            const created = Array.isArray(result) ? result[0] : result;
            lifeCategories.push(created);
            lifeCategories.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
