                                ${highlightedTranslation ? `<div class="diary-item-content" style="color: #666; font-style: italic; margin-top: 8px;">${highlightedTranslation}</div>` : ''}
                            </div>
                            <span class="diary-expand-hint">展開</span>
                        </div>
                        ${imagesHtml}
                        ${tagsHtml ? `<div class="diary-item-tags">${tagsHtml}</div>` : ''}
                    </div>
                `;
            }).join('');

            refreshDiaryExpandStates();
            await setupInlineEditorAfterRender();
        }

        function toggleDiaryExpand(event, bodyEl) {
            if (!bodyEl) return;
            // 點 checklist／按鈕／連結時不觸發展開
            if (event.target.closest('input, button, a, label, .checklist-item, .checklist-checkbox')) return;
            if (!bodyEl.classList.contains('has-more')) return;

            const collapsing = !bodyEl.classList.contains('is-collapsed');
            bodyEl.classList.toggle('is-collapsed', collapsing);
            const hint = bodyEl.querySelector('.diary-expand-hint');
            if (hint) hint.textContent = collapsing ? '展開' : '收合';
        }

        function refreshDiaryExpandStates() {
            document.querySelectorAll('.diary-item-body').forEach((body) => {
                const clamp = body.querySelector('.diary-clamp');
                const hint = body.querySelector('.diary-expand-hint');
                if (!clamp) return;

                // 先以收合狀態量是否超過 6 行
                body.classList.add('is-collapsed');
                const overflowed = clamp.scrollHeight > clamp.clientHeight + 2;
                if (overflowed) {
                    body.classList.add('has-more');
                    if (hint) hint.textContent = '展開';
                } else {
                    body.classList.remove('has-more');
                    body.classList.remove('is-collapsed');
                    if (hint) hint.textContent = '';
                }
            });
        }

        // 高亮文字（支持多個關鍵字）
        function highlightText(text, keywords) {
            if (!keywords || (Array.isArray(keywords) && keywords.length === 0)) {
                return escapeHtml(text);
            }
            
            // 如果 keywords 是字符串，轉換為數組
            const keywordArray = Array.isArray(keywords) ? keywords : [keywords];
            
            // 先轉義 HTML
            let highlightedText = escapeHtml(text);
            
            // 對每個關鍵字進行高亮
            keywordArray.forEach(keyword => {
                if (keyword && keyword.trim()) {
                    const regex = new RegExp(`(${escapeRegex(keyword.trim())})`, 'gi');
                    highlightedText = highlightedText.replace(regex, '<span class="highlight">$1</span>');
                }
            });
            
            return highlightedText;
        }

        // 轉義HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 轉義正則表達式特殊字符
        function escapeRegex(text) {
            return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 將日記內容中的 checklist 轉換為可交互的 HTML
        function convertChecklistToHTML(content, diaryId) {
            // 匹配 ☐ 或 ☑ 符號，也支持舊格式 `- [ ]` 或 `- [x]`
            const lines = content.split('\n');
            let html = '';
            let checklistIndex = 0;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                // 匹配新格式：☐ 或 ☑ 開頭的行
                let checklistMatch = line.match(/^(\s*)(☐|☑)\s*(.+)$/);
                // 如果沒有匹配，嘗試舊格式
                if (!checklistMatch) {
                    checklistMatch = line.match(/^(\s*)- \[([ x])\]\s*(.+)$/);
                }
                
                if (checklistMatch) {
                    // 這是 checklist 項目
                    // 移除所有縮進，讓它貼齊左側
                    let checked = false;
                    let text = '';
                    
                    // 判斷是新格式還是舊格式
                    if (checklistMatch[2] === '☑') {
                        checked = true;
                        text = checklistMatch[3].trim(); // 移除文字前後的空白
                    } else if (checklistMatch[2] === '☐') {
                        checked = false;
                        text = checklistMatch[3].trim(); // 移除文字前後的空白
                    } else {
                        // 舊格式
                        checked = checklistMatch[2] === 'x';
                        text = checklistMatch[3].trim(); // 移除文字前後的空白
                    }
                    
                    const checkboxId = `checklist-${diaryId}-${checklistIndex}`;
                    const checkedAttr = checked ? 'checked' : '';
                    const completedClass = checked ? 'completed' : '';
                    
                    html += `<div class="checklist-item ${completedClass}">
<input type="checkbox" id="${checkboxId}" ${checkedAttr} onchange="toggleChecklistItem(${diaryId}, ${i}, this.checked)">
<span class="checklist-item-text">${escapeHtml(text)}</span>
</div>`;
                    // 如果不是最後一行，添加換行
                    if (i < lines.length - 1) {
                        html += '<br>';
                    }
                    checklistIndex++;
                } else {
                    // 普通文字
                    html += escapeHtml(line);
                    if (i < lines.length - 1) {
                        html += '<br>';
                    }
                }
            }
            
            return html;
        }

        // 切換 checklist 項目的完成狀態
        async function toggleChecklistItem(diaryId, lineIndex, checked) {
            const diary = diaries[findDiaryIndexById(diaryId)];
            if (!diary) return;
            
            const content = diary.content;
            const lines = content.split('\n');
            
            // 更新指定行的 checklist 狀態
            if (lineIndex >= 0 && lineIndex < lines.length) {
                const line = lines[lineIndex];
                // 先嘗試匹配新格式（☐ 或 ☑）
                let checklistMatch = line.match(/^(\s*)(☐|☑)\s*(.+)$/);
                
                if (checklistMatch) {
                    // 新格式 - 移除縮進，貼齊左側
                    const text = checklistMatch[3].trim(); // 移除文字前後的空白
                    const newSymbol = checked ? '☑' : '☐';
                    lines[lineIndex] = `${newSymbol} ${text}`;
                } else {
                    // 嘗試舊格式
                    checklistMatch = line.match(/^(\s*)- \[([ x])\]\s*(.+)$/);
                    if (checklistMatch) {
                        const text = checklistMatch[3].trim(); // 移除文字前後的空白
                        // 轉換為新格式，移除縮進
                        const newSymbol = checked ? '☑' : '☐';
                        lines[lineIndex] = `${newSymbol} ${text}`;
                    }
                }
            }
            
            // 更新日記內容
            const newContent = lines.join('\n');
            diary.content = newContent;
            
            // 同步到 Supabase
            if (USE_SUPABASE) {
                await supabaseRequest('diaries', 'PATCH', {
                    content: newContent
                }, `?id=eq.${diaryId}`);
            }
            
            // 儲存到 localStorage
            localStorage.setItem('diaries', JSON.stringify(diaries));
            
            // 重新渲染日記列表
            renderDiaryList();
        }

        // Checklist 篩選功能
        function filterChecklist(filter) {
            checklistFilter = filter;
            const buttons = document.querySelectorAll('.checklist-filter-btn');
            buttons.forEach((btn, index) => {
                btn.classList.remove('active');
                if ((filter === 'all' && index === 0) || 
                    (filter === 'completed' && index === 1) || 
                    (filter === 'pending' && index === 2)) {
                    btn.classList.add('active');
                }
            });
            
            // 重新渲染日記列表
            renderDiaryList();
        }

        // 檢查日記是否有 checklist
        function hasChecklist(content) {
            // 支持新格式（☐ 或 ☑）和舊格式（- [ ] 或 - [x]）
            return /^\s*(☐|☑)\s*.+$/m.test(content) || /^\s*- \[[ x]\]\s*.+$/m.test(content);
        }

        // 檢查日記的 checklist 狀態
        function getChecklistStatus(content) {
            // 支持新格式和舊格式
            const checklistRegex = /^\s*(☐|☑|- \[([ x])\])\s*(.+)$/gm;
            let match;
            let total = 0;
            let completed = 0;
            
            while ((match = checklistRegex.exec(content)) !== null) {
                total++;
                // 檢查是否完成
                if (match[1] === '☑' || match[2] === 'x') {
                    completed++;
                }
            }
            
            return { total, completed, pending: total - completed };
        }
    </script>
</body>
